/* ===== index.html 9-29 - :root design tokens (light / default) ===== */
  :root{
    --ink:#0a0a0a; --cream:#FFFFFF; --card:#FFFFFF; --gold:#0a0a0a; --blue:#1B2E52; --blue900:#1B2E52; --honey:#A83246; --honey-d:#7A2536; --grey:#6B6B6B; --tint:#E9EBF1;
    --amber:#f59e0b; --amber-d:#d97706; --navy:#0A1F3D; --green:#10b981; --green-d:#059669;
    --bg:#FFFFFF; --grey2:#A6A6A6; --hover:#2A2A2A;
    --hairline:rgba(17,17,16,.12); --panel:#F5F5F5;
    /* vertical accents (reserved for future) */
    --cobalt:#3B77C2; --magenta:#B8438A; --verde:#3E9B4F;
    /* öllin movement brand mark */
    --ollin-ink:#16130F; --ollin-teal:#1E9DA8; --ollin-maroon:#A83246; --ollin-gold:#F5B700;
    /* Ōllin Tracker monochrome-editorial redesign (Today screen + global chrome) */
    --o2-ink:#0A0A0A; --o2-slate:#767676; --o2-mute:#A3A3A3;
    --o2-hairline:#E6E6E6; --o2-paper:#FFFFFF; --o2-hoverbg:#FAFAFA;
    --o2-accent:#C9A227;
    /* Ōllin Tracker — light/electric-blue system (full redesign, replaces o2-*) */
    --lt-paper:#EFEFF2; --lt-surface:#FFFFFF; --lt-ink:#121218; --lt-ink2:#35353D;
    --lt-mute:#5A5A63; --lt-dim:#78787F; --lt-rule:#E1E1E6; --lt-rule2:#D6D6DD;
    --lt-accent:#1B4DFF; --lt-accent-deep:#0B33CC; --lt-accent-alt:#2A44B8;
    --lt-accent-wash-a:rgba(27,77,255,.14); --lt-accent-wash-b:rgba(27,77,255,.10);
    --lt-ai-surface:#F1F4FF; --lt-ai-rule:#BCCBFF; --lt-ai-rule2:#D8E0FF;
    --lt-poster-bg:#0B0B09; --lt-poster-fg:#F4F2ED; --lt-row-hover:#F7F7FA;
  }

/* ===== index.html 30-70 - dark-theme token remap (:root[data-lt-theme="dark"]) ===== */
  /* Dark theme — the locked ŌLLIN palette. Blue #7A93A8 carries state and
     emphasis, gold #C9A84C is the rare accent. Every screen reads these, so
     Contacts and Pipeline pick up the design system without their own rules. */
  :root[data-lt-theme="dark"]{
    --lt-paper:#0A0A0A; --lt-surface:#141412; --lt-ink:#F8F7F4; --lt-ink2:#C9C9C2;
    --lt-mute:#9A968B; --lt-dim:#7A7A74; --lt-rule:#26262B; --lt-rule2:#3A3A34;
    --lt-accent:#7A93A8; --lt-accent-deep:#7A93A8; --lt-accent-alt:#C9A84C;
    --lt-accent-wash-a:rgba(122,147,168,.22); --lt-accent-wash-b:rgba(122,147,168,.12);
    --lt-ai-surface:#0F1418; --lt-ai-rule:#26343F; --lt-ai-rule2:#1B242B;
    --lt-poster-bg:#050505; --lt-poster-fg:#F8F7F4; --lt-row-hover:#141412;
  }
  /* The app card stops at 1456px; the page behind it has to match, or a wide
     window shows pale gutters around a screen that is black by construction. */
  :root[data-lt-theme="dark"],
  :root[data-lt-theme="dark"] body,
  :root[data-lt-theme="dark"] .app{background:#0A0A0A;}

  /* Screens the redesign has not reached yet — add a contact, import a list,
     manage account — are still built on the original light palette. Rather
     than restyle each of them, remap the palette itself for dark, so a white
     card with near-white text becomes a dark card with readable text
     everywhere at once. The o2-* set is the same story, one system older. */
  :root[data-lt-theme="dark"]{
    --ink:#F8F7F4; --cream:#0A0A0A; --card:#141412; --bg:#0A0A0A; --panel:#141412;
    --grey:#9A968B; --grey2:#7A7A74; --tint:#1B242B; --hover:#26262B;
    --hairline:#26262B; --gold:#C9A84C; --honey:#7A93A8; --honey-d:#5C7A91;
    --blue:#7A93A8; --blue900:#0B1C2C; --navy:#0B1C2C;
    --o2-ink:#F8F7F4; --o2-slate:#9A968B; --o2-mute:#7A7A74;
    --o2-hairline:#26262B; --o2-paper:#141412; --o2-hoverbg:#1A1A17;
    --o2-accent:#C9A84C; --ollin-ink:#F8F7F4;
  }
  /* A few places hard-code white rather than reading --card. */
  :root[data-lt-theme="dark"] .enginecard,
  :root[data-lt-theme="dark"] .o2-bfyg textarea,
  :root[data-lt-theme="dark"] .dc-script textarea{background:#141412;color:#F8F7F4;}
  :root[data-lt-theme="dark"] .uploadzone{background:#0A0A0A;border-color:#3A3A34;}
  :root[data-lt-theme="dark"] .uploadzone.drag{border-color:#7A93A8;background:#12181C;}
  :root[data-lt-theme="dark"] .btn-primary{background:#F8F7F4;color:#0A0A0A;}
  :root[data-lt-theme="dark"] select option{background:#141412;color:#F8F7F4;}
  /* --navy is the dark card colour now, so anything drawn in it vanishes. */
  :root[data-lt-theme="dark"] .uz-plus{color:#7A93A8;}

/* ===== index.html 71-74 - reset, html/body, .hide ===== */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--ink);}
  body{font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;font-size:16px;}
  .hide{display:none !important;}

/* ===== index.html 206-259 - lock screen, .btn, auth inputs, sender/onboarding overlay ===== */
  /* lock screen (passkey) — VAMOS styling */
  .lock{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;}
  .lock-card{max-width:410px;width:100%;text-align:center;border:.5px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:46px 38px;background:var(--card);}
  .lock .mark{font-family:'Geist',sans-serif;font-weight:900;font-size:34px;}
  .lock .sub{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin:8px 0 26px;}
  .lock-card p{color:var(--grey);font-size:14px;line-height:1.55;margin:0 0 20px;}
  .lock-ico{display:none;}
  .btn{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--honey);color:var(--ink);border:.5px solid var(--honey);border-radius:9px;padding:14px 20px;cursor:pointer;width:100%;display:block;font-weight:600;}
  .btn:hover{background:var(--honey-d);border-color:var(--honey-d);color:var(--ink);}
  .btn.ghost{background:none;color:var(--ink);border:.5px solid var(--hairline);}
  .btn.ghost:hover{background:none;border-color:var(--ink);color:var(--ink);}
  .lock-alt{margin-top:18px;font-size:12.5px;color:var(--grey);}
  .lock-alt a{color:var(--honey);font-weight:600;cursor:pointer;text-decoration:underline;}
  .lock-rec{margin-top:16px;display:none;}
  .lock-rec.show{display:block;}
  .lock-rec input{width:100%;text-align:center;font-family:'Geist Mono',monospace;letter-spacing:.12em;margin-bottom:10px;background:var(--cream);border:.5px solid var(--hairline);padding:11px;color:var(--ink);}
  .lock-err{color:#A5341F;font-size:13px;margin-top:14px;min-height:16px;font-weight:500;}
  .auth-lead{color:var(--grey);font-size:14px;line-height:1.55;margin:0 0 18px;}
  .auth-input{width:100%;background:var(--bg);border:.5px solid var(--hairline);border-radius:8px;font-family:'Geist',sans-serif;font-size:15px;padding:13px;color:var(--ink);margin-bottom:10px;text-align:left;}
  .auth-input:focus{outline:2px solid var(--honey);outline-offset:0;border-color:var(--honey);}
  .auth-input::placeholder{color:var(--grey2);}
  /* outreach identity (onboarding + settings) */
  .sender-overlay{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,10,10,.5);overflow-y:auto;}
  .sender-overlay.solid{background:var(--bg);}
  .sender-card{max-width:460px;width:100%;background:var(--card);border:.5px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);padding:38px 34px;text-align:left;position:relative;}
  .sender-card h2{font-family:'Geist',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 8px;}
  .sender-card .sc-help{font-size:13.5px;color:var(--grey);line-height:1.5;margin:0 0 22px;}
  .sender-card .fld{margin-bottom:14px;}
  .sender-card label{display:block;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin:0 0 6px;}
  .sender-card label .opt{color:var(--grey2);}
  .sender-card .auth-input{margin-bottom:0;}
  .sender-card textarea.auth-input{min-height:60px;resize:vertical;font-size:14px;line-height:1.5;}
  .sender-card select.auth-input{cursor:pointer;}
  .sender-card .sc-err{color:#A5341F;font-size:12.5px;min-height:16px;margin:6px 0 6px;}
  .sender-card .sc-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;color:var(--grey2);cursor:pointer;line-height:1;}
  .sender-card .sc-close:hover{color:var(--ink);}
  /* onboarding wizard: progress dots + steps + actions */
  .sender-card .sc-steps{display:flex;gap:6px;margin:0 0 22px;}
  .sender-card .sc-dot{height:3px;flex:1;border-radius:2px;background:var(--hairline);transition:background .2s;}
  .sender-card .sc-dot.on{background:var(--honey);}
  .sender-card .sc-step{display:none;}
  .sender-card .sc-step.on{display:block;}
  .sender-card input.auth-input[disabled]{color:var(--grey);cursor:not-allowed;opacity:.7;}
  .sender-card .sc-actions{display:flex;gap:12px;align-items:center;margin-top:20px;}
  .sender-card .sc-actions .btn{flex:1;margin:0;}
  .sender-card .sc-back{background:none;border:none;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);cursor:pointer;padding:0 6px;}
  .sender-card .sc-back:hover{color:var(--ink);}
  /* pricing step */
  .sc-price{text-align:center;padding:10px 0 2px;}
  .sc-price .sc-free{font-family:'Geist',sans-serif;font-weight:800;font-size:56px;letter-spacing:-.04em;line-height:1;color:var(--honey);}
  .sc-price .sc-freelbl{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin:10px 0 24px;}
  .sc-price .sc-then{font-size:15.5px;line-height:1.6;color:var(--ink);}
  .sc-price .sc-then b{font-weight:700;}
  .sc-price .sc-fine{font-size:12.5px;color:var(--grey);margin-top:12px;line-height:1.5;}

/* ===== index.html 262-263 - .verifybar / .demobar (runtime banners) ===== */
  .demobar a{color:var(--ollin-maroon);font-weight:600;text-decoration:underline;cursor:pointer;margin-left:6px;}
  /* Both bars sit on the dark page, so they cannot keep the paper palette. */

/* ===== index.html 276-287 - .btn-mini.gopro + .upgrade-card (founding/upgrade modal) ===== */
  .btn-mini.gopro{border-color:var(--blue);color:var(--blue);}
  .btn-mini.gopro:hover{background:var(--blue);border-color:var(--blue);color:#fff;}
  .upgrade-card{text-align:left;}
  .upgrade-card .up-eyebrow{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:8px;}
  .upgrade-card .btn{background:var(--blue);border-color:var(--blue);color:#fff;}
  .upgrade-card .btn:hover{background:#12203C;border-color:#12203C;color:#fff;}
  .upgrade-card .up-title{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0 0 12px;line-height:1.15;}
  .upgrade-card .up-body{color:var(--grey);font-size:14px;line-height:1.6;margin:0 0 14px;}
  .upgrade-card .up-list{list-style:none;padding:0;margin:0 0 20px;}
  .upgrade-card .up-list li{position:relative;padding-left:22px;font-size:14px;line-height:1.5;color:var(--ink);margin-bottom:9px;}
  .upgrade-card .up-list li::before{content:"\2713";position:absolute;left:0;top:0;color:var(--blue);font-weight:700;}
  .upgrade-card .up-fine{font-size:11.5px;color:var(--grey2);margin:12px 0 0;text-align:center;}

/* ===== index.html 315-321 - ANY/WAY stacked lockup (.logo-lockup/.ll-*) ===== */
  /* ANY / WAY. stacked lockup (lock screen) */
  .logo-lockup{margin-bottom:26px;}
  .ll-word{font-family:'Geist',sans-serif;font-weight:900;font-size:46px;line-height:1;letter-spacing:-.03em;color:var(--ink);}
  .ll-way{color:var(--honey);}
  .ll-rule{width:44px;height:3px;background:var(--honey);margin:18px auto 12px;}
  .ll-tag{font-family:'Geist',sans-serif;font-size:18px;color:var(--ink);font-weight:500;}
  .ll-domain{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--grey);margin-top:26px;}

/* ===== index.html 331 - :root --radius / --shadow (referenced by .lock-card, .sender-card) ===== */
  :root{ --radius:12px; --shadow:0 2px 5px rgba(17,17,17,.06),0 14px 40px rgba(17,17,17,.14); }

/* ===== index.html 340-347 - .brandmark + orbiting dot animation ===== */
  .brandmark{display:inline-flex;align-items:center;gap:8px;}
  .brandmark svg{display:block;flex-shrink:0;}
  .brandmark .bm-word{font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-.04em;color:var(--ollin-ink);}
  .brandmark .bm-tag{font-family:var(--mono, 'Geist Mono', monospace);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ollin-maroon);margin-left:2px;}
  /* Motion is landing-page only — the in-app nav and login modal keep a static mark */
  .gl-mark svg .mv-dot{transform-box:view-box;transform-origin:36px 36px;animation:mv-orbit 7s linear infinite;}
  @keyframes mv-orbit{from{transform:rotate(120deg);}to{transform:rotate(480deg);}}
  @media (prefers-reduced-motion: reduce){ .gl-mark svg .mv-dot{animation:none;} }

/* ===== index.html 480 - @keyframes oh-drift (drives .ol-hatch) ===== */
  @keyframes oh-drift{from{background-position:0 0,0 0;}to{background-position:-240px 0,180px 60px;}}

/* ===== index.html 595-621 - the OLLIN login page (.ol-*) + reduced-motion guard ===== */
  /* ---------- LOGIN ----------
     Its own dark world regardless of the stored theme — you have not chosen
     one yet at this point, and the design is dark. */
  .ol-page{position:relative;overflow:hidden;min-height:100vh;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Archivo',Helvetica,Arial,sans-serif;}
  .ol-hatch{position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 1px,transparent 1px,transparent 13px),
                     repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 19px);
    animation:oh-drift 16s linear infinite;}
  .ol-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 50% 30%,rgba(10,10,10,.85),rgba(10,10,10,0) 70%);}
  .ol-card{position:relative;width:420px;max-width:calc(100vw - 40px);padding:44px 40px 40px;background:#141412;border:1px solid #26262B;border-radius:10px;}
  .ol-brand{text-align:center;margin-bottom:36px;}
  .ol-mark{font-size:30px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#F8F7F4;}
  .ol-lbl{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:#9A968B;text-transform:uppercase;}
  .ol-h{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-bottom:28px;color:#F8F7F4;}
  .ol-form{display:flex;flex-direction:column;gap:18px;}
  .ol-field label{display:block;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.14em;color:#9A968B;text-transform:uppercase;}
  .ol-field input{width:100%;background:#0A0A0A;border:1px solid #26262B;border-radius:6px;padding:13px 14px;font-family:'Archivo',sans-serif;font-size:15px;color:#F8F7F4;outline:none;transition:border-color .18s ease;}
  .ol-field input::placeholder{color:#5A564C;}
  .ol-field input:focus{border-color:#5A564C;}
  .ol-go{width:100%;background:#F8F7F4;color:#0A0A0A;border:none;border-radius:6px;padding:14px 22px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.14em;cursor:pointer;transition:background .18s ease;}
  .ol-go:hover{background:#E7E5E0;}
  .ol-go:disabled{opacity:.6;cursor:default;}
  .ol-err{min-height:16px;margin-top:14px;text-align:center;font-size:13px;font-weight:500;color:#C97A6A;}
  .ol-alt{margin-top:10px;text-align:center;font-size:12.5px;color:#9A968B;}
  .ol-alt a{color:#9A968B;text-decoration:underline;cursor:pointer;}
  .ol-alt a:hover{color:#C9A84C;}
  @media (prefers-reduced-motion:reduce){ .ol-hatch{animation:none;} }

/* ===== index.html 1006-1008 - toast stack (.o2-stack / .o2-note) ===== */
  .o2-stack{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:200;pointer-events:none;}
  .o2-note{display:flex;align-items:center;gap:10px;background:var(--o2-ink);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.2px;padding:13px 18px;white-space:nowrap;transform-origin:right bottom;transition:transform .3s cubic-bezier(.16,1,.3,1),filter .3s ease,opacity .3s ease;}
  .o2-note .dot{width:7px;height:7px;background:var(--o2-accent);flex:none;}

/* ===== index.html 1247 - .btn:hover rebrand override ===== */
  .btn:hover{background:var(--ink);border-color:var(--ink);color:var(--honey);}

/* ===== index.html 1342-1346 - .lp-overlay / .lp-close (auth + upgrade modal shell) ===== */
  .lp-overlay{position:fixed;inset:0;z-index:90;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;padding:24px;}
  .lp-overlay.hide{display:none;}
  .lp-overlay .lock-card{position:relative;}
  .lp-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;color:var(--grey2);cursor:pointer;line-height:1;}
  .lp-close:hover{color:var(--ink);}

/* ===== index.html 1549-1551 - .btn final override (ink fill) ===== */
  /* Primary buttons + work-card neutrals (ink; navy freed for comeback) */
  .btn{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn:hover{background:var(--hover);border-color:var(--hover);color:#fff;}

/* NOTE (verbatim quirk, not a transcription error): --navy-2 below is only ever
   declared inside the landing-page `.site{}` scope in index.html (line 1579), never
   on :root. Outside .site it resolves to nothing - same as in the original file. */
/* ===== index.html 1568-1571 - .upgrade-card final override (navy) ===== */
  .upgrade-card .up-eyebrow{color:var(--navy);}
  .upgrade-card .up-list li::before{color:var(--navy);}
  .upgrade-card .btn{background:var(--navy);border-color:var(--navy);color:#fff;}
  .upgrade-card .btn:hover{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}


/* ===================== Ollin : Vamos — front end (coral / GLVE) ===================== */
:root{
  --vm-paper:#0B0D11; --vm-surface:#141821; --vm-surface2:#1A2029; --vm-surface3:#212936;
  --vm-line:#262F3D; --vm-line2:#333F50;
  --vm-ink:#EEF2F8; --vm-dim:#94A3B6; --vm-dim2:#63718A;
  --c:#EA7987; --c-dim:#C4606D; --c-soft:rgba(234,121,135,.12);
  --vm-warn:#FBBF24; --vm-no:#F87171; --vm-cool:#7DD3FC; --vm-ok:#4ADE80;
  --arch:"Archivo",ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
#appMain{background:var(--vm-paper);color:var(--vm-ink);min-height:100vh;
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:120px}
#appMain.hide{display:none}
#appMain button{font:inherit;cursor:pointer;border:none;border-radius:10px}
#appMain input,#appMain textarea,#appMain select{font:inherit;color:var(--vm-ink);
  background:var(--vm-surface2);border:1px solid var(--vm-line);border-radius:10px;
  padding:11px 13px;width:100%;outline:none}
#appMain input:focus,#appMain textarea:focus,#appMain select:focus{border-color:var(--c-dim);
  box-shadow:0 0 0 3px rgba(234,121,135,.10)}
#appMain textarea{resize:vertical;line-height:1.62}
#appMain a{color:var(--c)}
.vm-wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
.hide{display:none !important}

/* top bar */
.vm-top{position:sticky;top:0;z-index:30;background:rgba(11,13,17,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--vm-line)}
.vm-topin{max-width:900px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap}
.vm-brand{font-family:var(--arch);font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.vm-brand em{font-style:normal;color:var(--c);font-weight:600}
.vm-brand b{color:var(--c);text-shadow:0 0 20px rgba(234,121,135,.55),0 0 44px rgba(234,121,135,.22)}
.vm-tabs{display:flex;gap:4px}
.vm-tabs button{background:transparent;color:var(--vm-dim2);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;padding:7px 11px;border-radius:7px;transition:.15s}
.vm-tabs button:hover{color:var(--vm-ink)}
.vm-tabs button.on{background:var(--c-soft);color:var(--c)}
.vm-bar{flex:1;min-width:70px;height:7px;background:var(--vm-surface2);border-radius:99px;overflow:hidden}
.vm-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--c-dim),var(--c));
  transition:width .4s cubic-bezier(.4,0,.2,1)}
.vm-count{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--vm-dim);white-space:nowrap}
.vm-av{width:32px;height:32px;border-radius:50%;background:var(--vm-surface3);
  border:1px solid var(--vm-line2);color:var(--vm-dim);font-size:12px;font-weight:800;
  display:grid;place-items:center;padding:0}
.vm-av:hover{border-color:var(--c);color:var(--c)}

/* type */
.vm-h1{font-family:var(--arch);font-weight:800;font-size:34px;letter-spacing:-.034em;
  margin:0 0 10px;line-height:1.12;text-shadow:0 0 34px rgba(234,121,135,.20)}
.vm-sub{color:var(--vm-dim);margin:0 0 26px;font-size:15px;line-height:1.62}
.mn{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--vm-dim2);font-weight:500}
.vm-card{background:var(--vm-surface);border:1px solid var(--vm-line);border-radius:16px;
  padding:22px;margin-bottom:16px}
.vm-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vm-pri{background:var(--c);color:#2E0F14;font-weight:800;padding:12px 22px;transition:.15s;
  font-family:var(--arch)}
.vm-pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.vm-gh{background:var(--vm-surface2);color:var(--vm-ink);border:1px solid var(--vm-line);
  padding:12px 18px;transition:.15s}
.vm-gh:hover{border-color:var(--c-dim);color:var(--c)}

/* front door */
.vm-hero{text-align:center;padding:44px 0 18px}
.vm-mark{width:70px;height:70px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--c),#D2596A);box-shadow:0 0 60px rgba(234,121,135,.35)}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.q{background:var(--vm-surface2);border:1px solid var(--vm-line);border-radius:13px;padding:16px;
  text-align:left;transition:.15s;color:var(--vm-ink)}
.q:hover{border-color:var(--c);transform:translateY(-2px)}
.q .n{font-family:var(--arch);font-weight:900;font-size:28px;color:var(--c);line-height:1;
  text-shadow:0 0 22px rgba(234,121,135,.4)}
.q .l{font-size:13px;font-weight:700;margin-top:7px;font-family:var(--arch)}
.q .d2{font-size:11.5px;color:var(--vm-dim2);margin-top:2px;line-height:1.45}

/* the card */
.stack{position:relative;margin-top:6px}
.g1,.g2{position:absolute;left:0;right:0;top:0;height:150px;border:1px solid var(--vm-line);
  border-radius:16px;background:var(--vm-surface);pointer-events:none}
.g1{transform:translateY(-8px) scaleX(.975);opacity:.55}
.g2{transform:translateY(-16px) scaleX(.95);opacity:.28}
.sheet{position:relative;background:linear-gradient(180deg,#171C26,#131820);
  border:1px solid var(--vm-line2);border-radius:16px;padding:32px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(234,121,135,.04);
  animation:vmin .3s cubic-bezier(.2,.7,.3,1)}
.sheet::before{content:"";position:absolute;top:0;left:0;right:0;height:210px;pointer-events:none;
  background:radial-gradient(130% 110% at 24% -10%,rgba(234,121,135,.15),transparent 64%)}
.sheet>*{position:relative;z-index:1}
@keyframes vmin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.out{animation:vmout .16s ease forwards}
@keyframes vmout{to{opacity:0;transform:translateY(-12px) scale(.99)}}

.khead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ktag{border:1px solid var(--vm-line2);border-radius:7px;padding:5px 10px;font-family:var(--mono);
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.kt-new{color:var(--c);border-color:rgba(234,121,135,.42);background:rgba(234,121,135,.09)}
.kt-fu{color:var(--vm-cool);border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.08)}
.kt-late{color:var(--vm-warn);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.kdots{margin-left:auto;display:flex;gap:5px;align-items:center}
.dot3{width:8px;height:8px;border-radius:50%;background:var(--vm-line2)}
.dot3.on{background:var(--c);box-shadow:0 0 10px rgba(234,121,135,.6)}
.kname{font-family:var(--arch);font-size:38px;font-weight:800;letter-spacing:-.038em;line-height:1.05;
  margin:0 0 12px;text-shadow:0 0 34px rgba(234,121,135,.30),0 0 74px rgba(234,121,135,.12)}
.klede{font-size:15px;line-height:1.66;color:var(--vm-dim);margin:0 0 20px;max-width:64ch}
.klede b{color:var(--vm-ink);font-weight:650}
.kpill{display:flex;align-items:center;gap:12px;background:var(--vm-surface2);border:1px solid var(--vm-line);
  border-radius:99px;padding:9px 20px 9px 9px;margin-bottom:20px}
.kpill .bdg{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--vm-surface3);color:var(--c);font-size:13px}
.kpill .tx{font-size:13.5px;line-height:1.5;color:var(--vm-dim)}
.kpill .tx b{color:var(--vm-ink);font-weight:700}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.tbox{border:1px solid var(--vm-line);border-radius:15px;padding:17px;background:rgba(255,255,255,.012)}
.tbox .ic{color:var(--c);margin-bottom:13px;display:block;opacity:.9}
.tbox .tl{margin-bottom:7px;color:var(--c)}
.tbox .tv{font-size:13.5px;line-height:1.55;color:var(--vm-dim);overflow-wrap:anywhere}
.tbox .tv b{color:var(--vm-ink);font-weight:650}
.rule{height:1px;background:var(--vm-line);margin:24px 0 20px}
.tabs{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.tab{background:transparent;color:var(--vm-dim);border:1px solid var(--vm-line);padding:7px 14px;
  font-size:12.5px;border-radius:99px;transition:.15s;font-weight:600}
.tab.on{background:var(--c);color:#2E0F14;border-color:var(--c);font-weight:800}
.tab:hover:not(.on){color:var(--vm-ink);border-color:var(--vm-line2)}
.mini{background:var(--vm-surface2);border:1px solid var(--vm-line);color:var(--vm-dim2);
  padding:6px 11px;font-size:12px;transition:.15s}
.mini:hover{color:var(--c);border-color:var(--c-dim)}
.len{font-size:11.5px;color:var(--vm-dim2);text-align:right;margin-top:5px}
.go{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 4px}
.go a,.go .gb{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--vm-surface2);border:1px solid var(--vm-line);color:var(--vm-ink);padding:11px 16px;
  border-radius:10px;font-size:13.5px;font-weight:650;transition:.15s}
.go a:hover,.go .gb:hover{border-color:var(--c);color:var(--c);transform:translateY(-1px)}
.go .off{opacity:.32;pointer-events:none}
.kcta{width:100%;display:flex;align-items:center;gap:14px;background:var(--c);color:#2E0F14;
  border-radius:99px;padding:8px 24px 8px 8px;font-family:var(--arch);font-weight:800;font-size:15px;
  text-align:left;transition:.16s;box-shadow:0 8px 26px rgba(234,121,135,.20);margin-top:16px}
.kcta:hover{filter:brightness(1.07);transform:translateY(-1px)}
.kcta .bdg{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(46,15,20,.16);font-size:15px}
.kcta .sm{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;opacity:.72}
.k2{display:flex;gap:10px;margin-top:11px}
.k2 button{flex:1;background:transparent;border:1px solid var(--vm-line);color:var(--vm-dim);
  padding:12px;font-size:13px;font-weight:650;transition:.15s;font-family:var(--arch)}
.k2 .kl:hover{color:var(--vm-warn);border-color:rgba(251,191,36,.45)}
.k2 .kr:hover{color:var(--vm-no);border-color:rgba(248,113,113,.45)}

/* contacts */
.vm-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.vm-tbl th,.vm-tbl td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--vm-line)}
.vm-tbl th{color:var(--vm-dim2);font-family:var(--mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:500}
.vm-tbl tr.clk{cursor:pointer}
.vm-tbl tr.clk:hover td{background:rgba(234,121,135,.05)}
.pill{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;
  letter-spacing:.08em;text-transform:uppercase}
.p-due{background:rgba(234,121,135,.16);color:var(--c)}
.p-late{background:rgba(251,191,36,.15);color:var(--vm-warn)}
.p-rest{background:var(--vm-surface3);color:var(--vm-dim2)}
.p-done{background:rgba(74,222,128,.14);color:var(--vm-ok)}
.drop{border:2px dashed var(--vm-line2);border-radius:14px;padding:26px;text-align:center;
  transition:.18s;cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--c);background:rgba(234,121,135,.05)}
.drop .big{font-family:var(--arch);font-weight:800;font-size:16px;margin-bottom:5px}
.drop .sm{font-size:12.5px;color:var(--vm-dim2)}

/* guide */
.gbub{position:fixed;right:22px;bottom:22px;z-index:60;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(145deg,var(--c),#D2596A);display:grid;place-items:center;border:none;
  cursor:pointer;box-shadow:0 10px 34px rgba(234,121,135,.30);transition:.2s}
.gbub:hover{transform:scale(1.07)}
.gbub .gnd{position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;
  background:var(--vm-ok);border:2.5px solid var(--vm-paper)}
.gpanel{position:fixed;right:22px;bottom:92px;z-index:60;width:378px;max-width:calc(100vw - 34px);
  max-height:min(580px,calc(100vh - 130px));display:flex;flex-direction:column;background:var(--vm-surface);
  border:1px solid var(--vm-line2);border-radius:18px;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.62);animation:gin .22s cubic-bezier(.2,.7,.3,1);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;color:var(--vm-ink)}
@keyframes gin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.ghead{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--vm-line);
  background:linear-gradient(180deg,rgba(234,121,135,.08),transparent)}
.gav{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--c),#D2596A)}
.ghead .t{font-weight:750;font-size:14px;letter-spacing:-.01em;font-family:var(--arch)}
.ghead .s{font-size:11.5px;color:var(--vm-dim2);margin-top:1px}
.gx{margin-left:auto;background:transparent;border:none;color:var(--vm-dim2);font-size:19px;
  line-height:1;padding:5px 8px;cursor:pointer}
.gx:hover{color:var(--vm-ink)}
.gbody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.msg{display:flex;gap:9px;align-items:flex-start;animation:vmin .22s ease}
.msg .av{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--c),#D2596A);font-size:13px}
.msg .bub{background:var(--vm-surface2);border:1px solid var(--vm-line);border-radius:12px;
  border-top-left-radius:4px;padding:10px 13px;font-size:13.3px;line-height:1.58}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--c-soft);border-color:rgba(234,121,135,.26);
  border-top-left-radius:12px;border-top-right-radius:4px}
.msg.me .av{background:var(--vm-surface3)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.gchip{background:var(--vm-surface2);border:1px solid var(--vm-line);color:var(--vm-dim);font-size:12px;
  padding:7px 12px;border-radius:99px;transition:.15s;font-weight:600;cursor:pointer}
.gchip:hover{color:var(--c);border-color:var(--c-dim)}
.gchip.key{background:var(--c);color:#2E0F14;border-color:var(--c);font-weight:800}
.gchip[disabled]{opacity:.45;pointer-events:none}
.gask{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--vm-line);background:var(--vm-surface2)}
.gask input{background:var(--vm-paper);border:1px solid var(--vm-line2);border-radius:10px;
  padding:10px 12px;font-size:13px;width:100%;color:var(--vm-ink);outline:none}
.gask button{background:var(--c);color:#2E0F14;font-weight:800;padding:0 16px;flex:0 0 auto;
  border:none;border-radius:10px;cursor:pointer}

@media(max-width:700px){.tri{grid-template-columns:1fr}}
@media(max-width:640px){
  .sheet{padding:20px}.kname{font-size:26px}.vm-h1{font-size:25px}
  .vm-wrap{padding:18px 13px 60px}.gpanel{right:12px;left:12px;width:auto;bottom:86px}
  .gbub{right:16px;bottom:16px}.vm-tabs{order:3;width:100%}
}

/* ===================== the guide — full-screen landing ===================== */
:root{ --gd-bg:#0A0B11; --gd-bar:#14161D; --gd-ink:#F1EEE7; --gd-dim:#686772;
       --gd-mic:#9AA1AF; --gd-teal:#EA7987; --gd-teal-d:#D2596A; }
body.gd-on{background:var(--gd-bg)}
#appMain.gd-mode{background:var(--gd-bg);padding-bottom:0}
#appMain.gd-mode .vm-top{display:none}
.gd{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 22px;position:relative;overflow:hidden}
.gd::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 42% at 50% 44%, rgba(234,121,135,.10), transparent 70%)}
.gd>*{position:relative;z-index:1}
.gd-eye{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gd-dim);margin-bottom:22px;text-align:center}
.gd-h{font-family:var(--arch);font-weight:800;font-size:44px;line-height:1.14;letter-spacing:-.035em;
  color:var(--gd-ink);text-align:center;margin:0 0 18px;max-width:15ch;
  text-shadow:0 0 34px rgba(234,121,135,.16),0 0 80px rgba(234,121,135,.06)}
.gd-p{font-size:16.5px;line-height:1.62;color:#9A9AA4;text-align:center;margin:0 0 34px;
  max-width:44ch}
.gd-p b{color:var(--gd-ink);font-weight:650}
.gd-bar{display:flex;align-items:center;gap:10px;width:min(560px,100%);
  background:var(--gd-bar);border:1px solid #22242C;border-radius:99px;padding:9px 9px 9px 24px;
  transition:.18s}
.gd-bar:focus-within{border-color:rgba(234,121,135,.40);box-shadow:0 0 0 4px rgba(234,121,135,.09)}
.gd-bar input{flex:1;background:transparent;border:none;outline:none;box-shadow:none;padding:12px 0;
  font-size:16px;color:var(--gd-ink);width:auto}
.gd-bar input::placeholder{color:#5C5C66}
.gd-ic{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:transparent;border:1px solid #2A2D35;color:var(--gd-mic);transition:.16s;padding:0}
.gd-ic:hover{color:var(--gd-ink);border-color:#3C4049}
.gd-ic.rec{color:#F87171;border-color:rgba(248,113,113,.5);animation:gdpulse 1.2s ease-in-out infinite}
@keyframes gdpulse{0%,100%{opacity:1}50%{opacity:.45}}
.gd-go{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--gd-teal);color:#2E0F14;border:none;transition:.16s;padding:0;
  box-shadow:0 0 18px rgba(234,121,135,.34),0 0 44px rgba(234,121,135,.13)}
.gd-go:hover{background:var(--gd-teal-d);transform:scale(1.06);
  box-shadow:0 0 34px rgba(234,121,135,.7),0 0 76px rgba(234,121,135,.32)}
.gd-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px;
  width:min(600px,100%)}
.gd-chip{background:transparent;border:1px solid #22242C;color:#7C7C87;font-size:12.5px;
  padding:9px 15px;border-radius:99px;transition:.16s;cursor:pointer;font-weight:550}
.gd-chip:hover{color:var(--gd-ink);border-color:#3C4049}
.gd-chip.key{border-color:rgba(234,121,135,.48);color:var(--gd-teal)}
.gd-chip.key:hover{background:rgba(234,121,135,.10);border-color:var(--gd-teal)}
.gd-say{margin-top:26px;max-width:52ch;text-align:center;font-size:14.5px;line-height:1.66;
  color:#9A9AA4;animation:vmin .3s ease}
.gd-say b{color:var(--gd-ink);font-weight:650}
.gd-foot{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 26px;font-size:11.5px;color:#3F3F49;z-index:1}
.gd-foot button{background:transparent;border:none;color:#3F3F49;font-size:11.5px;cursor:pointer;padding:0}
.gd-foot button:hover{color:#9A9AA4}
@media(max-width:640px){.gd-h{font-size:29px}.gd-p{font-size:15px}.gd-bar{padding-left:18px}}

/* --- guide: beat #appMain base input/button styles --- */
#appMain .gd-bar input,
#appMain .gd-bar input:focus{background:transparent;border:none;border-radius:0;
  box-shadow:none;padding:12px 0;width:auto;flex:1;font-size:16px;color:var(--gd-ink)}
#appMain .gd-ic{border-radius:50%;background:transparent;border:1px solid #2A2D35;
  color:var(--gd-mic);width:42px;height:42px;padding:0}
#appMain .gd-ic:hover{color:var(--gd-ink);border-color:#3C4049}
#appMain .gd-go{border-radius:50%;width:44px;height:44px;padding:0;border:none;
  background:var(--gd-teal);color:#2E0F14;
  box-shadow:0 0 18px rgba(234,121,135,.34),0 0 44px rgba(234,121,135,.13)}
#appMain .gd-go:hover{background:var(--gd-teal-d);
  box-shadow:0 0 34px rgba(234,121,135,.75),0 0 78px rgba(234,121,135,.34)}
#appMain .gd-chip{border:1px solid #24262F;border-radius:99px;background:transparent;
  color:#7C7C87;padding:9px 15px;font-size:12.5px;font-weight:550}
#appMain .gd-chip:hover{color:var(--gd-ink);border-color:#3C4049}
#appMain .gd-chip.key{border-color:rgba(234,121,135,.48);color:var(--gd-teal);
  box-shadow:0 0 22px rgba(234,121,135,.13)}
#appMain .gd-chip.key:hover{background:rgba(234,121,135,.10);border-color:var(--gd-teal);
  color:var(--gd-teal);box-shadow:0 0 30px rgba(234,121,135,.22)}
#appMain .gd-foot button{background:transparent;border:none;border-radius:0;padding:0}

/* --- guide: brand lockup --- */
.gd-logo{display:flex;justify-content:center;margin-bottom:30px}
.gd-word{font-family:var(--arch);font-weight:800;font-size:17px;letter-spacing:-.012em;
  color:var(--gd-ink);display:flex;align-items:center;gap:7px}
.gd-word i{font-style:normal;color:var(--gd-teal);font-weight:600;opacity:.85}
.gd-word b{color:var(--gd-teal);font-weight:800;
  text-shadow:0 0 20px rgba(234,121,135,.6),0 0 46px rgba(234,121,135,.26)}
@media(max-width:640px){.gd-logo{margin-bottom:26px}.gd-word{font-size:15px}}

/* --- guide: coral light shining from behind --- */
.gd::before{content:none}
.gd-light{position:absolute;inset:-40vh -40vw;pointer-events:none;z-index:0}
/* the room the light fills */
.gd-light::before{content:"";position:absolute;left:50%;top:50%;

}

/* ===================== guide entrance (motion.dev feel) ===================== */
/* Signature easing: expo-out. Everything rises, unblurs, and settles. */
:root{ --gd-ease:cubic-bezier(.16,1,.3,1); --gd-ease2:cubic-bezier(.22,1,.36,1); }

@keyframes gdRise{
  from{opacity:0;transform:translateY(22px);filter:blur(9px)}
  to  {opacity:1;transform:translateY(0);filter:blur(0)}
}
@keyframes gdWord{
  from{opacity:0;transform:translateY(105%) rotate(2.5deg)}
  to  {opacity:1;transform:translateY(0) rotate(0)}
}
@keyframes gdBar{
  from{opacity:0;transform:translateY(26px) scale(.955);filter:blur(10px)}
  to  {opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes gdPop{
  0%  {opacity:0;transform:scale(.2)}
  62% {opacity:1;transform:scale(1.22)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes gdRing{
  from{opacity:0;transform:rotate(-115deg) scale(.72)}
  to  {opacity:.9;transform:rotate(0) scale(1)}
}
@keyframes gdLightIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.72)}
  to  {opacity:.8;transform:translate(-50%,-50%) scale(1)}
}
@keyframes gdGlowIn{ from{box-shadow:0 0 0 rgba(234,121,135,0)}
  to{box-shadow:0 0 18px rgba(234,121,135,.34),0 0 44px rgba(234,121,135,.13)} }

/* light: bloom in, then hand off to the breathe loop */
.gd-light::before{animation:gdLightIn 1.5s var(--gd-ease) both, gdBreathe 9s 1.5s ease-in-out infinite}
.gd-light::after{animation:gdLightIn 1.5s .16s var(--gd-ease) both, gdBreathe 9s 1.66s ease-in-out infinite reverse}

/* everything else rises on a stagger */
.gd-word       {animation:gdRise .82s .18s var(--gd-ease) both}
.gd-eye        {animation:gdRise .82s .32s var(--gd-ease) both}
.gd-h          {opacity:1}
.gd-h .w{display:inline-block;overflow:hidden;vertical-align:top}
.gd-h .w i{display:inline-block;font-style:inherit;
  animation:gdWord .92s var(--gd-ease) both;animation-delay:calc(.44s + var(--i) * .055s)}
.gd-p          {animation:gdRise .9s .74s var(--gd-ease) both}
.gd-bar        {animation:gdBar 1.05s .86s var(--gd-ease) both}
#appMain .gd-go{animation:gdGlowIn .9s 1.3s var(--gd-ease) both}
.gd-chips .gd-chip{animation:gdRise .72s var(--gd-ease) both;
  animation-delay:calc(1.08s + var(--i) * .07s)}
.gd-foot       {animation:gdRise .8s 1.5s var(--gd-ease) both}

@media(prefers-reduced-motion:reduce){
  .gd-light::before{animation:gdLightIn .01s both}
  .gd-light::after{animation:gdLightIn .01s both}
  .gd-word,.gd-eye,.gd-h .w i,.gd-p,.gd-bar,
  #appMain .gd-go,.gd-chips .gd-chip,.gd-foot{animation-duration:.01s !important;animation-delay:0s !important}
}
/* returning to the door mid-session — no re-entrance */
.gd-instant .gd-word,
.gd-instant .gd-eye,.gd-instant .gd-h .w i,.gd-instant .gd-p,.gd-instant .gd-bar,
.gd-instant .gd-chips .gd-chip,.gd-instant .gd-foot,
#appMain .gd-instant .gd-go{animation-duration:.28s !important;animation-delay:0s !important}

function startQueue(which) {
  var b = buckets(), q = [];
  if (which === "late") q = b.late;
  else if (which === "today") q = b.today;
  else if (which === "fresh") q = b.fresh;
  else if (which === "due") q = b.late.concat(b.today);

  if (a.stack) out.push("Named stack means a real skills bar — a generic bench will not clear it.");
  if (a.money) out.push("Fresh capital means a board expecting the plan to move this quarter.");
  if (t.angle && /repost|reposted|open|days|weeks|months|still/i.test(t.angle))
    out.push("This req has been sitting. Whoever owns it is absorbing the work right now.");
  if (t.angle && /raise|series|funding|round|\$/i.test(t.angle))
    out.push("Post-raise hiring plans slip first on senior roles — that is where the gap opens.");
  if (t.angle && /open(ed|ing)?\s+(a\s+)?(second|new|another)|expansion|facility|center|plant|site/i.test(t.angle))
    out.push("New site means the roles are date-bound. Slipping is visible to everyone.");
  if (a.size && /1000|5000|10,?000|enterprise/i.test(String(a.size)))

  } else {
    line = "Follow-up " + (t.touchNo - 1) + " for <b>" + esc(t.who || t.company) +
      "</b>. I'll open on something new instead of bumping the thread — that's the whole trick.";
  }
  if (!t.email && !t.li) line += "<br><br>No email and no LinkedIn on file — you'll be searching for them.";
  gmsg(line);
  setChips(GUIDE_CHIPS, true);
  var n = document.getElementById("gnd");
  if (n) n.classList.remove("hide");
}
var STEERS = {
  s_short: "Make it shorter.",
  s_conv: "More conversational.",
  s_angle: "Try a different angle.",
  s_near: "Lean into our nearshore capabilities."
};
function gdo(act, label) {
  if (label && act !== "draft") gmsg(esc(label), true);
  if (act === "go_contacts") { navView = "contacts"; VM.mode = "door"; render(); window.scrollTo(0, 0); return; }
  if (act === "how") return gmsg("Three moves:<br><br>1 · Contacts — import a list or add someone.<br>2 · I tell you who's due, you work them one card at a time.<br>3 · Ollin drafts each message; you edit and send.<br><br>Cadence is LinkedIn day 0 → Email +2 → Email +3. Three touches, then they're done.");
  if (act === "reply") return gmsg("Three replies you'll actually get:<br><br><b>“Send them over.”</b> → Two profiles, no attachments. Ask for a yes/no by Friday.<br><br><b>“We're all set.”</b> → “Understood — when the next req lands, want me ready?” Then mark Not a fit.<br><br><b>Silence.</b> → That's what the cadence is for. Don't chase manually.");
  if (act === "draft") { gmsg(esc(label || "Draft it"), true); return askOllin(""); }
  if (STEERS[act]) return askOllin(STEERS[act]);
  if (act.indexOf("q_") === 0) {
    var n = startQueue(act.slice(2));
    if (!n) { gmsg("Nothing in that bucket. Pick another."); return; }
    gmsg("Queued <b>" + n + "</b>. Vamos — first one's up.");
    navView = "today"; render(); window.scrollTo(0, 0); return;
  }
}
function gask() {
  var el2 = document.getElementById("gin"), q = el2.value.trim();
  if (!q) return;
  el2.value = "";
  gmsg(esc(q), true);
  var lq = q.toLowerCase();
  if (/how (does|do)|what is this|explain/.test(lq)) return gdo("how", "");
  if (/reply|respond|objection|says no|push ?back/.test(lq)) return gdo("reply", "");
  if (/due|waiting|today|left/.test(lq) && VM.mode !== "card") return gmsg("Head back to the guide screen for what is due.");
  if (VM.mode !== "card") return gmsg("Open a card and I'll draft or reshape the message. From here I can tell you what's due, or take you to Contacts.");
  askOllin(q);
}

/* ---------- contacts ---------- */
function viewContacts(v) {
  var td = todayStr();
  var rows = liveTouches().map(function (t) {
    var d = dueOf(t), st = d < td ? ["p-late", (daysBetween(d, td)) + "d late"]
      : (d === td ? ["p-due", "due today"] : ["p-rest", "in " + daysBetween(td, d) + "d"]);
    return '<tr class="clk" data-a="' + esc(t.acctId) + '" data-t="' + esc(t.threadId) + '">' +
      "<td><b>" + esc(t.who || "—") + "</b><br><span style=\"color:var(--vm-dim2);font-size:12px\">" +
      esc(t.title || "") + "</span></td>" +
      "<td>" + esc(t.company || "—") + "</td>" +
      "<td>" + t.touchNo + " / " + CADENCE.length + "</td>" +
      '<td><span class="pill ' + st[0] + '">' + st[1] + "</span></td></tr>";
  }).join("");
  var closed = contactCount() - liveTouches().length;
  v.innerHTML =
    '<h1 class="vm-h1">Contacts</h1>' +
    '<p class="vm-sub">' + contactCount() + " tracked · " + liveTouches().length + " still in cadence" +
    (closed > 0 ? " · " + closed + " finished" : "") +
    (isUnlimited() ? "" : " · " + freeLeft() + " free slots left") + "</p>" +
    '<div class="vm-card"><div class="drop" id="vmDrop">' +
    '<div class="big">Drop a CSV or Excel file</div>' +
    '<div class="sm">Required: Name · Company — everything else is optional</div></div>' +
    '<div class="vm-row" style="margin-top:13px">' +
    '<button class="vm-gh" id="vmPick">Choose file</button>' +
    '<button class="vm-gh" id="vmSheet">Import from Google Sheet</button>' +
    '<button class="vm-gh" id="vmExport">Export backup</button></div>' +
    '<div id="vmSheetHost"></div></div>' +
    (rows ? '<div class="vm-card"><table class="vm-tbl"><tr><th>Person</th><th>Company</th><th>Touch</th><th>Next</th></tr>' +
      rows + "</table></div>"
      : '<div class="vm-card"><p class="vm-sub" style="margin:0">Nobody in cadence yet. Drop a list above.</p></div>');
  var fi = document.getElementById("vmFile");
  document.getElementById("vmPick").onclick = function () { fi.click(); };
  var dz = document.getElementById("vmDrop");
  dz.onclick = function () { fi.click(); };
  ["dragenter", "dragover"].forEach(function (e) {
    dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.add("hot"); });
  });
  ["dragleave", "drop"].forEach(function (e) {
    dz.addEventListener(e, function (ev) { ev.preventDefault(); dz.classList.remove("hot"); });
  });
  dz.addEventListener("drop", function (ev) {
    var f = ev.dataTransfer && ev.dataTransfer.files[0];
    if (f) handleImportFile(f);
  });
  document.getElementById("vmSheet").onclick = function () {
    showSheetForm(document.getElementById("vmSheetHost"));
  };
  document.getElementById("vmExport").onclick = function () { doExport(); };
  Array.prototype.forEach.call(v.querySelectorAll("tr.clk"), function (tr) {
    tr.onclick = function () {
      var t = liveTouches().filter(function (x) {
        return x.acctId === tr.dataset.a && x.threadId === tr.dataset.t;
      })[0];
      if (!t) return;
      VM.queue = [t]; VM.i = 0; VM.greeted = {}; VM.mode = "card";
      VM.angle = "gap"; VM.channel = null;
      navView = "today"; render(); window.scrollTo(0, 0);
    };
  });
}

/* ---------- account ---------- */
function viewAccount(v) {
  v.innerHTML =
    '<h1 class="vm-h1">Account</h1>' +
    '<div class="vm-card"><div class="mn">Signed in</div>' +
    '<p class="vm-sub" style="margin:8px 0 14px">' + esc((ACCOUNT && ACCOUNT.email) || "—") +
    (ACCOUNT && ACCOUNT.verified === false ? " · unverified" : "") + "</p>" +
    '<div class="vm-row">' +
    '<button class="vm-gh" id="acSender">Outreach identity</button>' +
    '<button class="vm-gh" id="acEmail">Change email</button>' +
    '<button class="vm-gh" id="acOut">Log out</button></div></div>' +
    '<div class="vm-card"><div class="mn">Plan</div>' +
    '<p class="vm-sub" style="margin:8px 0 14px">' +
    (isUnlimited() ? "Unlimited" : "Free — " + freeLeft() + " of 25 contact slots left") + "</p>" +
    (isUnlimited() ? "" : '<button class="vm-pri" id="acUp">Get unlimited</button>') + "</div>" +
    '<div class="vm-card"><div class="mn">Data</div>' +
    '<div class="vm-row" style="margin-top:12px">' +
    '<button class="vm-gh" id="acExport">Export backup</button>' +
    '<button class="vm-gh" id="acRestoreBtn">Restore</button>' +
    '<button class="vm-gh" id="acDedupe">Delete duplicates</button>' +
    '<button class="vm-gh" id="acClear">Clear all</button></div>' +
    '<input type="file" id="acRestore" accept=".json" class="hide"></div>' +
    '<div class="vm-card"><div class="mn">Danger</div>' +
    '<div class="vm-row" style="margin-top:12px"><button class="vm-gh" id="acDel" style="color:var(--vm-no)">Delete account</button></div></div>';
  document.getElementById("acSender").onclick = function () { openSenderForm(); };
  document.getElementById("acEmail").onclick = function () { openChangeEmail(); };
  document.getElementById("acOut").onclick = function () { logout(); };
  var up = document.getElementById("acUp");
  if (up) up.onclick = function () { openUpgrade(); };
  document.getElementById("acExport").onclick = function () { doExport(); };
  var rf = document.getElementById("acRestore");
  document.getElementById("acRestoreBtn").onclick = function () { rf.click(); };
  rf.onchange = function (e) { if (e.target.files[0]) doRestore(e.target.files[0]); };
  document.getElementById("acDedupe").onclick = function () { doDedupe(); };
  document.getElementById("acClear").onclick = function () { doClear(); };
  document.getElementById("acDel").onclick = function () { openDeleteAccount(); };
}

/* ---------- wiring ---------- */
(function vmWire() {
  var fi = document.createElement("input");
  fi.type = "file"; fi.id = "vmFile"; fi.accept = ".csv,.xlsx,.xls,text/csv"; fi.className = "hide";
  fi.onchange = function (e) { var f = e.target.files[0]; if (f) handleImportFile(f); e.target.value = ""; };
  document.body.appendChild(fi);

  var gb = document.getElementById("gbub");
  if (gb) gb.onclick = function () {
    var p = document.getElementById("gpanel");
    p.classList.toggle("hide");
    var n = document.getElementById("gnd");
    if (n) n.classList.add("hide");
    if (!p.classList.contains("hide")) document.getElementById("gin").focus();
  };
  var gx = document.getElementById("gx");
  if (gx) gx.onclick = function () { document.getElementById("gpanel").classList.add("hide"); };
  var gs = document.getElementById("gsend");
  if (gs) gs.onclick = gask;
  var gi = document.getElementById("gin");
  if (gi) gi.addEventListener("keydown", function (e) { if (e.key === "Enter") gask(); });

  document.addEventListener("keydown", function (e) {
    var tg = e.target.tagName;
    if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
    if (e.key === "g" || e.key === "G") { var b = document.getElementById("gbub"); if (b) b.click(); return; }
    if (VM.mode !== "card") return;
    var t = VM.queue[VM.i];
    if (!t) return;
    if (e.key === "1") decide("sent", t);
    else if (e.key === "2") decide("later", t);
    else if (e.key === "3") decide("skip", t);
  });
})();


wireLanding();
boot();
})();
</script>
