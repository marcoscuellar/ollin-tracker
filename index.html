  .vl-footer{border-top:.5px solid var(--hairline);padding:28px 0 40px;}
  .vl-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);}
  @media(max-width:760px){
    .vl-steps,.vl-feat-grid,.vl-cells{grid-template-columns:1fr;}
    .vl-said-grid,.vl-cb-grid,.vl-man-grid{flex-direction:column;align-items:flex-start;}
    .vl-wyo-wrap{max-width:100%;}
    .vl-man-photo{width:140px;}
    .vl-sec{padding:60px 0;}
    .vl-hero{padding:72px 0 56px;}
  }


  /* landing: live work-card demo */
  .vl-demo-sec{padding:80px 0;background:#fff;border-top:.5px solid var(--hairline);}
  .vl-demo{max-width:720px;margin:48px auto 0;background:#fff;border-radius:var(--radius-card);box-shadow:0 6px 16px rgba(17,17,17,.18),0 22px 50px rgba(17,17,17,.34);padding:30px 32px;text-align:left;}
  .vl-demo-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;}
  .vl-demo-ava{width:52px;height:52px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--blue-900);flex-shrink:0;}
  .vl-demo-name{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--text-display);}
  .vl-demo-meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin-top:4px;}
  .vl-demo-due{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-900);background:var(--honey-500);border-radius:20px;padding:7px 14px;white-space:nowrap;}
  .vl-demo-touch{text-align:center;margin-bottom:16px;}
  .vl-demo-touch b{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-display);}
  .vl-demo-touch span{display:block;font-size:12.5px;color:var(--text-secondary);margin-top:3px;}
  .vl-tl{display:flex;justify-content:space-between;margin:6px 0 22px;}
  .vl-tl-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
  .vl-tl-node{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--hairline);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#fff;color:var(--text-secondary);z-index:2;font-family:var(--font-mono);}
  .vl-tl-step.active .vl-tl-node{background:var(--blue-900);border-color:var(--blue-900);color:#fff;}
  .vl-tl-line{position:absolute;top:15px;left:50%;width:100%;height:1.5px;background:var(--hairline);z-index:1;}
  .vl-tl-step:last-child .vl-tl-line{display:none;}
  .vl-tl-label{font-size:11px;color:var(--text-secondary);margin-top:9px;text-align:center;}
  .vl-tl-step.active .vl-tl-label{color:var(--text-primary);font-weight:600;}
  .vl-demo-mid{display:flex;background:var(--blue-900);border-radius:10px;padding:16px 20px;margin-bottom:18px;gap:16px;}
  .vl-demo-mid .m{flex:1;color:#fff;}
  .vl-demo-mid .mt{font-size:14px;font-weight:600;}
  .vl-demo-mid .ms{font-size:12px;color:rgba(255,255,255,.68);margin-top:2px;}
  .vl-demo-acts{display:flex;gap:10px;}
  .vl-demo-act{flex:1;text-align:center;font-size:13px;background:#fff;border:.5px solid var(--hairline);border-radius:9px;padding:14px;color:var(--text-primary);font-family:var(--font-body);}
  .vl-demo-act.done{background:var(--blue-900);border-color:var(--blue-900);color:#fff;}
  /* AI-assist affordance (navy = AI, per the system) */
  .vl-demo-ai{margin-top:18px;border-top:.5px solid var(--hairline);padding-top:18px;}
  .vl-demo-script{font-size:14px;line-height:1.55;color:var(--text-primary);background:var(--panel);border:.5px solid var(--hairline);border-radius:8px;padding:14px 16px;margin:0;}
  .vl-demo-ai-row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .vl-demo-rewrite{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;background:var(--blue-900);color:#fff;border:.5px solid var(--blue-900);border-radius:9px;padding:11px 18px;cursor:pointer;}
  .vl-demo-ai-note{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-900);}
  .vl-demo-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .vl-demo-chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:.5px solid var(--blue-900);color:var(--blue-900);background:transparent;border-radius:20px;padding:7px 13px;cursor:pointer;}
  .vl-demo-chip:hover{background:var(--blue-900);color:#fff;}
  @media(max-width:760px){.vl-demo{padding:22px 20px;}.vl-demo-acts{flex-wrap:wrap;}.vl-demo-act{min-width:calc(50% - 5px);}.vl-tl-label{font-size:9px;}.vl-demo-name{font-size:19px;}}


  /* ============ VAMOS app · GLVE accents: amber=AI, navy=comeback, green=status ============ */
  /* AI affordances -> burgundy (no orange anywhere in the Write-with-AI flow) */
  .script-actions button.ai-btn{color:var(--ollin-maroon);border-color:var(--ollin-maroon);}
  .script-actions button.ai-btn:hover{background:var(--ollin-maroon);border-color:var(--ollin-maroon);color:#fff;}
  .script-actions button.ai-btn[disabled]:hover{background:none;color:var(--ollin-maroon);}
  .ai-steer{border-color:var(--ollin-maroon);background:rgba(168,50,70,.06);}
  .ai-steer-lead{color:var(--ollin-maroon);}
  .ai-chip:hover{border-color:var(--ollin-maroon);color:var(--ollin-maroon);}
  .ai-steer-row input:focus{outline-color:var(--ollin-maroon);border-color:var(--ollin-maroon);}
  .ai-draft{background:var(--ollin-maroon);border-color:var(--ollin-maroon);color:#fff;}
  .ai-draft:hover{background:var(--honey-d);border-color:var(--honey-d);color:#fff;}
  /* subtle, non-blocking signal hint under an AI draft (from write.js angleWarning) */
  .ai-hint{display:none;margin-top:10px;font-size:12px;line-height:1.45;color:var(--grey);border-left:2px solid var(--ollin-maroon);background:rgba(168,50,70,.06);padding:8px 11px;border-radius:0 6px 6px 0;}
  .ai-hint.show{display:block;}
  /* Comeback + before-you-go -> navy */
  .comeback{border-left-color:var(--navy);}
  .comeback .cb-note{border-left-color:var(--navy);}
  .comeback .cb-back{background:var(--navy);border-color:var(--navy);}
  .comeback .cb-back:hover{background:#1a3052;border-color:#1a3052;color:var(--cream);}
  .handoff{border-left:3px solid var(--navy);}
  .handoff .saved{color:var(--green-d);}
  /* System status -> green */
  .pc-status.gold{color:var(--green-d);}
  .warm-title{color:var(--green-d);}
  .meter i.on,.meter.full i{background:var(--green);}
  .nav-bell .dot{background:var(--green);}
  .big-num.done{color:var(--green-d);}
  .handoff .saved{color:var(--green-d);}
  /* Primary buttons + work-card neutrals (ink; navy freed for comeback) */
  .btn{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn:hover{background:var(--hover);border-color:var(--hover);color:#fff;}
  .dc-due{background:var(--panel);color:var(--ink);border-color:var(--hairline);}
  .dc-due.over{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .tl-step.active .tl-node{background:var(--ollin-maroon);border-color:var(--ollin-maroon);}
  /* Review/Skip: neutral band with a dividing line between the two items */
  .dc-mid{background:var(--panel);border:none;border-radius:12px;padding:4px 8px;}
  .dc-mid .mi{padding:16px 18px;}
  .dc-mid .mi + .mi{border-left:1px solid var(--hairline);}
  .dc-mid .mi-t{color:var(--ink);} .dc-mid .mi-s{color:var(--grey);} .dc-mid .mi:hover .mi-t{color:var(--ink);}
  .dc-act.done{background:var(--ollin-maroon);border-color:var(--ollin-maroon);color:#fff;}
  .dc-act.done:hover{background:var(--honey-d);border-color:var(--honey-d);color:#fff;}
  /* Unlimited / upgrade -> navy (AI, secondary lead); active plan = green status */
  .planbar{border-left-color:var(--navy);}
  .planbar a{color:var(--navy);} .planbar a:hover{color:var(--navy-2);}
  .planbar.founding{border-left-color:var(--green-d);color:var(--ink);}
  .btn-mini.gopro{border-color:var(--navy);color:var(--navy);}
  .btn-mini.gopro:hover{background:var(--navy);border-color:var(--navy);color:#fff;}
  .upgrade-card .up-eyebrow{color:var(--navy);}
  .upgrade-card .up-list li::before{color:var(--navy);}
  .upgrade-card .btn{background:var(--navy);border-color:var(--navy);color:#fff;}
  .upgrade-card .btn:hover{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}

  /* ===================== VAMOS landing · GLVE / Marcos Cuellar system ===================== */
  .site{
    --font:'Geist',-apple-system,BlinkMacSystemFont,sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
    --bg:#fff; --ink:#0a0a0a; --ink-2:#525252; --ink-3:#a3a3a3; --ink-4:#d4d4d4;
    --line:#e7e5e4; --line-soft:#ededeb; --paper:#f5f5f4;
    --amber:#f59e0b; --amber-d:#d97706; --amber-ddd:#92400e; --amber-pale:#fef3c7; --amber-bg:#fffbeb;
    --navy:#0A1F3D; --navy-2:#1a3052; --navy-mid:#4B6177; --navy-soft:#8FA3B8; --navy-fade:#B8C5D1; --navy-on:#93c5fd;
    --green:#10b981; --green-d:#059669; --green-on:#4ade80;
    --r-1:4px; --r-2:8px; --r-3:12px; --r-4:14px; --r-5:16px; --r-6:20px; --r-7:28px; --r-8:32px; --r-pill:100px;
    --sh-card:0 12px 32px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04); --sh-hover:0 12px 28px rgba(0,0,0,.18);
    --ease:cubic-bezier(.16,1,.3,1);
    background:#fff; color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; letter-spacing:-.01em;
  }
  .site *{box-sizing:border-box;}
  .site .wrap{max-width:1240px;margin:0 auto;padding:0 48px;}
  @keyframes amberPulse{0%,100%{box-shadow:0 0 18px rgba(245,158,11,.14),0 8px 18px rgba(245,158,11,.06);}50%{box-shadow:0 0 30px rgba(245,158,11,.24),0 10px 22px rgba(245,158,11,.09);}}
  @keyframes navyPulse{0%,100%{box-shadow:0 0 18px rgba(10,31,61,.14),0 8px 18px rgba(10,31,61,.06);}50%{box-shadow:0 0 30px rgba(10,31,61,.24),0 10px 22px rgba(10,31,61,.09);}}
  /* --- system text --- */
  .site .eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
  .site .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;}
  /* --- header --- */
  .gl-head{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);}
  .gl-bar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:16px;}
  .gl-mark{font-weight:700;font-size:22px;letter-spacing:-.04em;}
  .gl-mark .m{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-left:14px;}
  /* minimal splash: logo, login, contact — the entire logged-out landing page */
  .lp-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center;}
  .lp-splash .gl-mark{font-size:34px;}
  .lp-splash .gl-mark svg{width:52px;height:45px;}
  .lp-splash .bm-tag{font-size:13px;}
  .lp-login-row{display:flex;align-items:center;gap:10px;}
  .lp-login-row label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
  .lp-login-row input{font-family:var(--font);font-size:15px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-3);width:220px;outline:none;transition:border-color .15s;}
  .lp-login-row input:focus{border-color:var(--ollin-maroon);}
  .lp-login-row button{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;border-radius:var(--r-3);background:var(--ollin-maroon);color:#fff;cursor:pointer;flex-shrink:0;}
  .lp-login-row button:hover{background:var(--honey-d);}
  .lp-login-row input.hide{display:none;}
  .lp-login-group{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .lp-err{font-size:12.5px;color:var(--ollin-maroon);min-height:1em;}
  .lp-signup{font-size:13px;color:var(--ink-3);}
  .lp-signup a{color:var(--ollin-maroon);font-weight:600;text-decoration:underline;cursor:pointer;}
  .lp-contact{font-size:13px;color:var(--ink-3);}
  .lp-contact a{color:var(--ollin-maroon);font-weight:600;text-decoration:underline;}
  /* --- buttons --- */
  .btn-p,.btn-s,.btn-a,.btn-m{display:inline-flex;align-items:center;gap:10px;font-family:var(--font);font-weight:600;letter-spacing:-.01em;cursor:pointer;border:none;text-decoration:none;transition:all .25s var(--ease);font-size:14px;}
  .btn-p{background:var(--ink);color:#fff;padding:16px 26px;border-radius:var(--r-3);}
  .btn-p:hover{transform:translateY(-2px);box-shadow:var(--sh-hover);}
  .btn-s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:16px 26px;border-radius:var(--r-3);}
  .btn-s:hover{border-color:var(--ink);background:#fff;}
  .btn-a{background:var(--amber);color:#1c0a00;padding:16px 26px;border-radius:var(--r-3);}
  .btn-a:hover{background:var(--amber-d);transform:translateY(-2px);}
  .btn-m{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:12px 18px;border-radius:var(--r-2);font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;}
  .btn-m:hover{background:#fff;border-color:var(--ink);}
  .btn-arrow{transition:transform .25s var(--ease);}
  .btn-p:hover .btn-arrow,.btn-a:hover .btn-arrow{transform:translateX(3px);}
  /* --- tags --- */
  .tag{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--r-1);font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .tag.pipeline{background:var(--paper);color:var(--ink-2);border:1px solid var(--line);}
  .tag.amber{background:var(--amber-pale);color:var(--amber-ddd);border:1px solid rgba(245,158,11,.35);}
  .tag.standalone{background:var(--ink);color:#fff;border:1px solid var(--ink);}
  .tag.navy{background:rgba(75,97,119,.10);color:var(--navy);border:1px solid rgba(75,97,119,.30);}
  .tag.live{background:rgba(16,185,129,.10);color:var(--green-d);border:1px solid rgba(16,185,129,.30);}
  /* --- status pill --- */
  .statuspill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);}
  .statuspill .dot{width:6px;height:6px;border-radius:50%;}
  .statuspill.live .dot{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15);}
  /* --- hero --- */
  .gl-hero{padding:96px 0 72px;}
  .gl-h1{font-weight:700;font-size:clamp(56px,8.5vw,120px);letter-spacing:-.05em;line-height:.92;margin:22px 0 0;max-width:15ch;}
  .gl-h1 .light{color:var(--ink-3);font-weight:400;}
  .gl-sub{font-size:20px;color:var(--ink-2);line-height:1.5;max-width:52ch;margin:28px 0 0;}
  .gl-cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:36px;}
  .gl-hero-note{margin-top:20px;}
  /* --- thread section (context-after-interruption story) --- */
  .gl-thread{padding:80px 0;border-top:1px solid var(--line);background:var(--paper);}
  .gl-thread .t-inner{max-width:680px;}
  .gl-thread .t-head{font-weight:700;font-size:clamp(30px,4.6vw,54px);letter-spacing:-.04em;line-height:1.04;margin:0;}
  .gl-thread .t-head .l1{display:block;color:var(--ink-3);font-weight:400;}
  .gl-thread .t-head .l2{display:block;color:var(--ink);}
  .gl-thread .t-story{margin-top:36px;display:flex;flex-direction:column;gap:20px;}
  .gl-thread .t-story p{font-size:19px;line-height:1.65;color:var(--ink-2);margin:0;max-width:46ch;}
  .gl-thread .t-story .t-beat{color:var(--ink);font-weight:500;}
  .gl-thread .t-turn{font-weight:700;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.03em;color:var(--ink);margin:40px 0 16px;}
  .gl-thread .t-close{font-size:17px;line-height:1.7;color:var(--ink-2);max-width:56ch;margin:0;}
  .gl-thread .t-close b{color:var(--ink);font-weight:600;}
  /* --- section scaffolding --- */
  .gl-sec{padding:72px 0;}
  .gl-sec-head{max-width:60ch;}
  .gl-h2{font-weight:700;font-size:clamp(32px,4vw,48px);letter-spacing:-.035em;line-height:1.02;margin:14px 0 0;}
  .gl-h2 .light{color:var(--ink-3);font-weight:400;}
  .gl-lead{font-size:16px;color:var(--ink-2);line-height:1.6;max-width:56ch;margin:18px 0 0;}
  /* --- impact bar --- */
  .impactbar{padding:56px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .impactbar .ib-head{text-align:center;margin-bottom:48px;}
  .impactbar .ib-head .gl-h2{margin-top:12px;}
  .impactbar .ib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 56px;max-width:1040px;margin:0 auto;}
  .impactbar .ib{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .impactbar .ib-lbl{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;}
  .impactbar .ib-val{font-size:clamp(40px,4.6vw,60px);font-weight:700;letter-spacing:-.04em;line-height:.95;}
  .impactbar .ib-desc{font-size:14px;color:var(--ink-2);}
  /* --- confessional --- */
  .gl-said{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;margin-top:44px;}
  .gl-said-list{list-style:none;margin:0;padding:0;}
  .gl-said-list li{font-weight:700;font-size:clamp(22px,3.4vw,40px);letter-spacing:-.03em;line-height:1.3;color:var(--ink);text-decoration:line-through;text-decoration-color:var(--ink-4);text-decoration-thickness:3px;}
  .gl-said-list li+li{margin-top:10px;}
  .gl-said-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-5);padding:32px 30px;font-size:17px;line-height:1.6;font-weight:450;}
  .gl-said-tag{margin-top:22px;}
  /* --- engine card grid --- */
  .gl-engines{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px;}
  .enginecard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-6);padding:32px 28px 28px;display:flex;flex-direction:column;min-height:400px;box-shadow:var(--sh-card);}
  .enginecard.amber{border:2px solid var(--amber);animation:amberPulse 4s ease-in-out infinite;}
  .enginecard.navy{border:2px solid var(--navy);animation:navyPulse 4s ease-in-out infinite;}
  .enginecard .ec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
  .enginecard .ec-num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-3);}
  .enginecard.amber .ec-num{color:var(--amber-d);} .enginecard.navy .ec-num{color:var(--navy-mid);}
  .enginecard .ec-icon{color:var(--ink);opacity:.9;margin-bottom:20px;}
  .enginecard.amber .ec-icon{color:var(--amber);opacity:1;} .enginecard.navy .ec-icon{color:var(--navy-mid);opacity:1;}
  .enginecard h3{font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1.05;margin:0 0 12px;}
  .enginecard p{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0 auto 0 0;}
  .enginecard .ec-foot{display:flex;align-items:center;gap:8px;margin-top:20px;font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
  .enginecard.amber .ec-foot{color:var(--amber-d);} .enginecard.navy .ec-foot{color:var(--navy-mid);}
  /* --- dark flow block --- */
  .darkflow{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:var(--r-7);padding:56px 48px;margin-top:16px;}

<script>
(function(){
  "use strict";

  // ---------- storage wrapper ----------
  // Order: window.storage (inside Claude) -> localStorage (real website) -> in-memory (last resort).
  var mem = {};
  var hasStore = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function");
  var hasLS = (function(){ try{ window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();
  async function sGet(k){
    if(hasStore){ try{ var r = await window.storage.get(k); return r ? r.value : null; }catch(e){} }
    if(hasLS){ try{ var v = window.localStorage.getItem(k); return v===null ? null : v; }catch(e){} }
    return (k in mem) ? mem[k] : null;
  }
  async function sSet(k,v){
    if(hasStore){ try{ await window.storage.set(k,v); return; }catch(e){} }
    if(hasLS){ try{ window.localStorage.setItem(k,v); return; }catch(e){} }
    mem[k]=v;
  }

  // ---------- model ----------
  var CADENCE = [
    {off:0,  ch:"li",   label:"LinkedIn"},
    {off:3,  ch:"em",   label:"Email"},
    {off:6,  ch:"li",   label:"LinkedIn"},
    {off:9,  ch:"em",   label:"Email"},
    {off:12, ch:"call", label:"Call"}
  ];
  var PERSONA_ENTRY = { "Champion":1, "Technical Evaluator":3, "Economic Buyer":5, "Additional":8, "Blocker":0 };
  var PERSONAS = ["Champion","Technical Evaluator","Economic Buyer","Additional","Blocker"];

  var state = { accounts:[], done:{}, notes:{}, reschedule:{}, todos:[], activeId:null, view:"today", seeded:false, sheetUrl:"", dailyGoal:50, handoffNote:"", extra:{}, coldStreakSince:null };
  var MODE = { api:false }; // api=true once the Vercel /api + KV backend is detected
  var DEMO = false; // ?demo=1 — public, unauthenticated walkthrough; nothing persists
  var ALL = "__all__"; // sentinel activeId meaning "show every account combined"

  // ---------- date helpers (local, no tz drift) ----------
  function todayStr(){ var d=new Date(); return iso(d); }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function pad(n){ return (n<10?"0":"")+n; }
  function parse(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return d; }
  function shiftWeekend(d){ var g=d.getDay(); if(g===6)d.setDate(d.getDate()+2); else if(g===0)d.setDate(d.getDate()+1); return d; }
  function fmtLong(s){ var d=parse(s); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
  function fmtShort(s){ var d=parse(s); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
  function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }

  // ---------- schedule build ----------
  function buildTouches(acct){
    var out=[];
    (acct.threads||[]).forEach(function(t){
      if(t.persona==="Blocker") return; // blocker not sequenced
      var entry = t.entryDay || PERSONA_ENTRY[t.persona] || 1;
      CADENCE.forEach(function(c,i){
        var d = addDays(acct.start, (entry-1)+c.off);
        d = shiftWeekend(d);
        out.push({
          id: acct.id+"|"+t.id+"|"+i,
          acctId: acct.id, threadId:t.id, company:acct.company,
          who:t.name, title:t.title, persona:t.persona,
          li:t.linkedin, email:t.email, angle:t.angle,
          ch:c.ch, chLabel:c.label, touchNo:i+1, date:iso(d)
        });
      });
    });
    return out;
  }
  function activeAcct(){ return state.accounts.find(function(a){return a.id===state.activeId;}); }
  function allTouches(){ var out=[]; state.accounts.forEach(function(a){ out=out.concat(buildTouches(a)); }); return out; }
  function byDateThenCompany(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    var ca=a.company||"", cb=b.company||"";
    if(ca!==cb) return ca<cb?-1:1;
    return a.touchNo-b.touchNo;
  }

  // ---------- persistence ----------
  async function load(){
    var a = await sGet("tracker:accounts");
    var d = await sGet("tracker:done");
    var n = await sGet("tracker:notes");
    var rs = await sGet("tracker:reschedule");
    var td = await sGet("tracker:todos");
    var act = await sGet("tracker:active");
    var seeded = await sGet("tracker:seeded");
    state.sheetUrl = (await sGet("tracker:sheetUrl")) || "";
    state.dailyGoal = parseInt(await sGet("tracker:dailyGoal"), 10) || 50;
    state.handoffNote = (await sGet("tracker:handoffNote")) || "";
    try{ state.extra = JSON.parse(await sGet("tracker:extra")) || {}; }catch(e){ state.extra = {}; }
    state.coldStreakSince = (await sGet("tracker:coldStreakSince")) || null;
    if(a){ try{ state.accounts = JSON.parse(a); }catch(e){} }
    if(d){ try{ state.done = JSON.parse(d); }catch(e){} }
    if(n){ try{ state.notes = JSON.parse(n); }catch(e){} }
    if(rs){ try{ state.reschedule = JSON.parse(rs); }catch(e){} }
    if(td){ try{ state.todos = JSON.parse(td); }catch(e){} }
    state.seeded = !!seeded;
    if(!state.seeded && (!state.accounts || state.accounts.length===0)){
      seed();
      state.seeded = true;
      localSave();
    }
    if(act===ALL || (act && state.accounts.some(function(x){return x.id===act;}))) state.activeId = act;
    if(!state.activeId && state.accounts.length) state.activeId = state.accounts[0].id;
  }

  // ---------- save layer (local keys OR Vercel KV via /api/entries) ----------
  var saveTimer=null;
  function localSave(){
    sSet("tracker:accounts", JSON.stringify(state.accounts));
    sSet("tracker:active", state.activeId||"");
    sSet("tracker:done", JSON.stringify(state.done));
    sSet("tracker:notes", JSON.stringify(state.notes));
    sSet("tracker:reschedule", JSON.stringify(state.reschedule||{}));
    sSet("tracker:todos", JSON.stringify(state.todos||[]));
    sSet("tracker:seeded", state.seeded?"1":"");
    sSet("tracker:sheetUrl", state.sheetUrl||"");
    sSet("tracker:dailyGoal", String(state.dailyGoal||50));
    sSet("tracker:handoffNote", state.handoffNote||"");
    sSet("tracker:extra", JSON.stringify(state.extra||{}));
    sSet("tracker:coldStreakSince", state.coldStreakSince||"");
  }
  function apiSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      fetch("/api/entries",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
        body:JSON.stringify({accounts:state.accounts,done:state.done,notes:state.notes,reschedule:state.reschedule||{},todos:state.todos||[],active:state.activeId,seeded:!!state.seeded,sheetUrl:state.sheetUrl||"",dailyGoal:state.dailyGoal||50,handoffNote:state.handoffNote||"",extra:state.extra||{},coldStreakSince:state.coldStreakSince||null})})
        .then(function(r){ if(!r.ok) throw new Error("save"); })
        .catch(function(){ toast("Save failed — check connection"); });
    },300);
  }
  function scheduleSave(){ if(DEMO) return; if(MODE.api) apiSave(); else localSave(); }
  // optimistic: update UI now, persist in the background
  function persistAccounts(){ scheduleSave(); return Promise.resolve(); }
  function persistDone(){ scheduleSave(); return Promise.resolve(); }
  function persistNotes(){ scheduleSave(); return Promise.resolve(); }

  function seed(){
    var t = todayStr();
    state.accounts = [{
      id:"demo", company:"Demo Account — replace with your first real one", start:t,
      threads:[
        {id:"d1", name:"Champion Contact", title:"Eng Manager, Platform", persona:"Champion", entryDay:1, channel:"li", linkedin:"", email:"", angle:"Platform rearchitecture needs senior capacity fast — nearshore seniors in EST hours."},
        {id:"d2", name:"Evaluator Contact", title:"Director of Engineering", persona:"Technical Evaluator", entryDay:3, channel:"li", linkedin:"", email:"", angle:"Vets the solution — lead with the Talent Map for their exact stack."},
        {id:"d3", name:"Buyer Contact", title:"VP Engineering / CTO", persona:"Economic Buyer", entryDay:5, channel:"em", linkedin:"", email:"", angle:"Owns the cost math — 30% under US market, ~$400K saved per 5-person team."}
      ]
    }];
    state.activeId="demo";
  }
  // Public, unauthenticated walkthrough (?demo=1) — obviously-fake sample data, never persisted.
  function seedPublicDemo(){
    var t = todayStr();
    state.accounts = [
      { id:"demoA", company:"Northwind Retail (sample)", start:t, threads:[
        {id:"na1", name:"Jordan Blake", title:"VP Engineering", persona:"Economic Buyer", entryDay:1, channel:"em", linkedin:"linkedin.com/in/sample-jordan", email:"jordan@example.com", angle:"Owns the budget — leads with the cost math for a 5-person nearshore pod.", signal:"Promoted to VP — 6 days ago", signalSrc:"LinkedIn", pulledAt:Date.now()-4*60*1000},
        {id:"na2", name:"Sam Rivera", title:"Director of Data Platform", persona:"Champion", entryDay:1, channel:"li", linkedin:"linkedin.com/in/sample-sam", email:"sam@example.com", angle:"Posted 6 open data-eng reqs in the last 30 days — feels the hiring pain daily.", pulledAt:Date.now()-45*60*1000},
        {id:"na3", name:"Casey Nguyen", title:"Staff Engineer", persona:"Technical Evaluator", entryDay:1, channel:"li", linkedin:"linkedin.com/in/sample-casey", email:"", angle:"Vets the stack fit — worth a Talent Map for their exact tooling.", pulledAt:Date.now()-3*3600*1000}
      ]},
      { id:"demoB", company:"Aster Health (sample)", start:t, threads:[
        {id:"ab1", name:"Priya Shah", title:"CTO", persona:"Economic Buyer", entryDay:1, channel:"em", linkedin:"", email:"priya@example.com", angle:"Compliance deadline in Q3 is forcing a hiring decision now.", pulledAt:Date.now()-2*3600*1000},
        {id:"ab2", name:"Marcus Webb", title:"Eng Manager", persona:"Champion", entryDay:1, channel:"li", linkedin:"", email:"", angle:"Team has been re-posting the same senior role for 90+ days.", pulledAt:Date.now()-26*3600*1000}
      ]}
    ];
    state.activeId="demoA";
    state.seeded=true;
  }

  // ---------- notification stack (max 4, newest full-scale, older ones scale/dim behind it) ----------
  function toast(msg){
    var stack=document.getElementById("o2Stack"); if(!stack) return;
    var note=el('<div class="o2-note"><span class="dot"></span><span></span></div>');
    note.lastChild.textContent=msg;
    stack.appendChild(note);
    while(stack.children.length>4) stack.removeChild(stack.firstChild);

      setTimeout(function(){ if(note.parentNode) note.parentNode.removeChild(note); restackNotes(); },200);
    },2600);

  function restackNotes(){

  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function extUrl(u){
    u=(u||"").trim();
    if(!u) return "";

    // reject placeholders / non-URLs like "(verify)", "TBD", a bare name, etc.
    if(/\s/.test(u) || !/[a-z0-9-]+\.[a-z]{2,}/i.test(u)) return "";

  // ---------- Engine 7 CSV import ----------
  function parseCSV(text){
    var rows=[], row=[], cur="", q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else {
        if(c==='"')q=true;
        else if(c===','){ row.push(cur); cur=""; }
        else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=""; }
        else cur+=c;
      }
    }
    if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){return (c||"").trim()!=="";}); });
  }
  function colMap(header){
    var m={}, lower=[];
    header.forEach(function(h,i){ var k=(h||"").trim().toLowerCase(); m[k]=i; lower[i]=k; });
    function find(){ for(var a=0;a<arguments.length;a++){ if(arguments[a] in m) return m[arguments[a]]; } return -1; }
    // findC: first column whose header contains ALL given substrings
    function findC(){ var t=[].slice.call(arguments); for(var i=0;i<lower.length;i++){ var h=lower[i]; if(t.every(function(s){return h.indexOf(s)>-1;})) return i; } return -1; }
    // pick: first index that is >= 0 (find/findC return -1 when not found)
    function pick(){ for(var a=0;a<arguments.length;a++){ if(arguments[a]>=0) return arguments[a]; } return -1; }
    return {
      first:find("first name","firstname","first"),
      last:find("last name","lastname","last"),
      name:find("name","full name","contact"),
      email:find("email","email address"),
      company:find("company","company name","account"),
      title:find("job title","title"),
      li:find("linkedin url","linkedin","linkedin profile"),
      thread:find("outreach thread","thread","persona"),
      seq:find("sequence day","entry day","day"),
      chan:find("first touch channel","channel","first channel"),
      angle:find("outreach angle","angle","why this person"),
      signal:find("signal","buying signal"),
      signalsrc:find("signal source","source"),
      status:find("lead status","status"),
      sector:find("sector","industry"),
      place:find("place","location","hq"),
      size:find("company size","employee count","size"),
      revenue:find("revenue","company revenue"),
      hiring:find("hiring"), hiringsrc:find("hiring source"),
      building:find("building"), buildingsrc:find("building source"),
      stack:find("stack","tech stack"), stacksrc:find("stack source"),
      money:find("money","funding"), moneysrc:find("money source"),
      contractor:find("contractor","is contractor"),
      t1:pick(find("touch 1 copy","touch 1","touch1 copy","linkedin 1","touch 1 message"), findC("outreach 1"), findC("linkedin","day 1")),
      t2subj:pick(find("touch 2 subject","email 1 subject","touch2 subject"), findC("email","subject")),
      t2:pick(find("touch 2 copy","touch 2","touch2 copy","email 1 body","touch 2 message"), findC("outreach 2","body"), findC("email","body")),
      t3:pick(find("touch 3 copy","touch 3","touch3 copy","linkedin 2","touch 3 message"), findC("outreach 3","linkedin"), findC("linkedin 2")),
      t4subj:pick(find("touch 4 subject","email 2 subject","touch4 subject"), findC("email 2","subject")),
      t4:pick(find("touch 4 copy","touch 4","touch4 copy","email 2 body","touch 4 message"), findC("email 2","body")),
      t5:pick(find("touch 5 copy","touch 5","touch5 copy","call script","touch 5 message"), findC("call/vm"), findC("call"))
    };
  }
  function personaFrom(thread, status){
    var s=((thread||"")+" "+(status||"")).toLowerCase();
    if(s.indexOf("blocker")>-1 || s.indexOf("hold")>-1) return "Blocker";
    if(s.indexOf("champion")>-1) return "Champion";
    if(s.indexOf("evaluat")>-1 || s.indexOf("technical")>-1 || s.indexOf("tech")>-1) return "Technical Evaluator";
    if(s.indexOf("buyer")>-1 || s.indexOf("economic")>-1) return "Economic Buyer";
    return "Additional";
  }
  function channelFrom(s){ s=(s||"").toLowerCase(); if(s.indexOf("email")>-1)return"em"; if(s.indexOf("call")>-1)return"call"; return "li"; }
  function dayFrom(s, persona){ var m=(s||"").match(/\d+/); if(m) return parseInt(m[0],10); return 1; } // no Sequence Day column → start today
  // Client intelligence provenance is the trust mechanic of the whole feature —
  // a signal is only ever shown alongside one of these exact, real source types.
  // Anything that doesn't match stays untracked rather than showing a made-up tag.
  var SIGNAL_SOURCES = ["LinkedIn","CRM","Email Log","Job Boards","Product Data","Call Notes"];
  function normSignalSource(s){
    s=(s||"").trim().toLowerCase();
    for(var i=0;i<SIGNAL_SOURCES.length;i++){ if(SIGNAL_SOURCES[i].toLowerCase()===s) return SIGNAL_SOURCES[i]; }
    return "";
  }
  // Company-level intel (hiring/building/stack/money) — same honesty rule as a
  // contact signal: a claim without one of these real source types stays untracked.
  var COMPANY_FACT_SOURCES = ["LinkedIn","Press","Job Board","Earnings","CRM","Product Data"];
  function normCompanyFactSource(s){
    s=(s||"").trim().toLowerCase();
    for(var i=0;i<COMPANY_FACT_SOURCES.length;i++){ if(COMPANY_FACT_SOURCES[i].toLowerCase()===s) return COMPANY_FACT_SOURCES[i]; }
    return "";
  }
  // Reads whichever company-intel columns are present on a CSV row. A
  // hiring/building/stack/money claim without a real source is dropped —
  // sector/place/size/revenue are plain directory facts, no source needed.
  function readCompanyFacts(get, cm){
    var f={};
    var sector=get(cm.sector); if(sector) f.sector=sector;
    var place=get(cm.place); if(place) f.place=place;
    var size=get(cm.size); if(size) f.size=size;
    var revenue=get(cm.revenue); if(revenue) f.revenue=revenue;
    var hiring=get(cm.hiring), hiringSrc=normCompanyFactSource(get(cm.hiringsrc));
    if(hiring && hiringSrc){ f.hiring=hiring; f.hiringSrc=hiringSrc; }
    var building=get(cm.building), buildingSrc=normCompanyFactSource(get(cm.buildingsrc));
    if(building && buildingSrc){ f.building=building; f.buildingSrc=buildingSrc; }
    var stack=get(cm.stack), stackSrc=normCompanyFactSource(get(cm.stacksrc));
    if(stack && stackSrc){ f.stack=stack; f.stackSrc=stackSrc; }
    var money=get(cm.money), moneySrc=normCompanyFactSource(get(cm.moneysrc));
    if(money && moneySrc){ f.money=money; f.moneySrc=moneySrc; }
    return f;
  }
  function applyCompanyFacts(acct, facts){ for(var k in facts){ acct[k]=facts[k]; } }
  function importEngine7(text){
    var rows=parseCSV(text);
    if(rows.length<2) return {ok:false,msg:"No data rows found"};
    var cm=colMap(rows[0]);
    if(cm.name<0 && cm.first<0) return {ok:false,msg:"No Name column found — include a header row with Name and Company"};
    var byCompany={}, factsByCompany={};
    var imported=0;
    for(var i=1;i<rows.length;i++){
      var r=rows[i];
      var get=function(idx){ return idx>=0 && idx<r.length ? (r[idx]||"").trim() : ""; };
      var name = cm.name>=0 ? get(cm.name) : (get(cm.first)+" "+get(cm.last)).trim();
      if(!name) continue;
      var company = get(cm.company) || "Imported account";
      var persona = personaFrom(get(cm.thread), get(cm.status));
      var thread={
        id:"t"+Date.now()+"_"+i+"_"+Math.floor(Math.random()*999),
        name:name, title:get(cm.title), persona:persona,
        entryDay: persona==="Blocker"?0:dayFrom(get(cm.seq), persona),
        channel:channelFrom(get(cm.chan)),
        linkedin:get(cm.li), email:get(cm.email),
        angle:get(cm.angle),
        signal:get(cm.signal), signalSrc:normSignalSource(get(cm.signalsrc)),
        isContractor: /^(y|yes|true|1)/i.test(get(cm.contractor)),
        pulledAt:Date.now()
      };
      if(!thread.signalSrc) thread.signal=""; // no valid, real source → not tracked, never shown
      // capture per-touch message copy (maps to the 5-touch cadence i=0..4)
      function withSubj(subj, body){ subj=(subj||"").trim(); body=(body||"").trim(); if(!body && !subj) return ""; return subj ? ("Subject: "+subj+"\n\n"+body) : body; }
      thread._msgs = {
        0: get(cm.t1),
        1: withSubj(get(cm.t2subj), get(cm.t2)),
        2: get(cm.t3),
        3: withSubj(get(cm.t4subj), get(cm.t4)),
        4: get(cm.t5)
      };
      (byCompany[company]=byCompany[company]||[]).push(thread);
      var rowFacts=readCompanyFacts(get, cm);
      factsByCompany[company]=factsByCompany[company]||{};
      for(var fk in rowFacts) factsByCompany[company][fk]=rowFacts[fk];
      imported++;
    }
    var lastId=null;
    Object.keys(byCompany).forEach(function(company){
      var existing=state.accounts.find(function(a){return a.company.toLowerCase()===company.toLowerCase();});
      var acctId, threadsToAdd=byCompany[company];
      if(existing){ existing.threads=(existing.threads||[]).concat(threadsToAdd); acctId=existing.id; }
      else { acctId="a"+Date.now()+"_"+Math.floor(Math.random()*999); state.accounts.push({id:acctId, company:company, start:todayStr(), threads:threadsToAdd}); }
      applyCompanyFacts(state.accounts.find(function(a){return a.id===acctId;}), factsByCompany[company]||{});
      // now that account id is known, drop any captured message copy into the matching touch slots
      threadsToAdd.forEach(function(t){
        if(t._msgs){
          for(var k=0;k<5;k++){ var v=(t._msgs[k]||"").trim(); if(v) state.notes[acctId+"|"+t.id+"|"+k]=v; }
          delete t._msgs;
        }
      });
      lastId=acctId;
    });
    if(lastId) state.activeId=lastId;
    return {ok:true, count:imported, accounts:Object.keys(byCompany).length};
  }

  // ---------- shared upsert import (used by Google Sheet sync) ----------
  function withSubjG(subj, body){ subj=(subj||"").trim(); body=(body||"").trim(); if(!body && !subj) return ""; return subj ? ("Subject: "+subj+"\n\n"+body) : body; }
  function importRows(rows, upsert){
    if(!rows || rows.length<2) return {ok:false,msg:"No data rows found (need a header row + at least one contact)"};
    var cm=colMap(rows[0]);
    if(cm.name<0 && cm.first<0) return {ok:false,msg:"No Name column found — check the header row"};
    var added=0, updated=0, skipped=0, lastAcctId=null;
    var budget=freeLeft(); // new contacts allowed under the free cap (Infinity if unlimited)
    for(var i=1;i<rows.length;i++){
      var r=rows[i];
      var get=function(idx){ return idx>=0 && idx<r.length ? (r[idx]||"").trim() : ""; };
      var name = cm.name>=0 ? get(cm.name) : (get(cm.first)+" "+get(cm.last)).trim();
      if(!name) continue;
      var company = get(cm.company) || "Imported account";
      var persona = personaFrom(get(cm.thread), get(cm.status));
      var signalSrc=normSignalSource(get(cm.signalsrc));
      var fields = {
        name:name, title:get(cm.title), persona:persona,
        entryDay: persona==="Blocker"?0:dayFrom(get(cm.seq), persona),
        channel:channelFrom(get(cm.chan)), linkedin:get(cm.li), email:get(cm.email), angle:get(cm.angle),
        signal: signalSrc?get(cm.signal):"", signalSrc: signalSrc,
        isContractor: /^(y|yes|true|1)/i.test(get(cm.contractor)),
        pulledAt: Date.now()
      };
      var msgs = { 0:get(cm.t1), 1:withSubjG(get(cm.t2subj),get(cm.t2)), 2:get(cm.t3), 3:withSubjG(get(cm.t4subj),get(cm.t4)), 4:get(cm.t5) };
      var acct = state.accounts.find(function(a){ return normCompany(a.company)===normCompany(company); });
      if(!acct){ acct={ id:"a"+Date.now()+"_"+i+"_"+Math.floor(Math.random()*999), company:company, start:todayStr(), threads:[] }; state.accounts.push(acct); }
      applyCompanyFacts(acct, readCompanyFacts(get, cm));
      acct.threads=acct.threads||[];
      var thread=null;
      if(upsert){ var key=normContact(fields); if(key) thread=acct.threads.find(function(t){ return normContact(t)===key; }); }
      if(thread){
        thread.name=fields.name; thread.title=fields.title; thread.persona=fields.persona; thread.entryDay=fields.entryDay;
        thread.channel=fields.channel; thread.linkedin=fields.linkedin; thread.email=fields.email; thread.angle=fields.angle;
        thread.signal=fields.signal; thread.signalSrc=fields.signalSrc; thread.pulledAt=fields.pulledAt;
        thread.isContractor=fields.isContractor;
        updated++;
      } else {
        if(added>=budget){ skipped++; continue; } // over the free cap — hold this one back
        thread={ id:"t"+Date.now()+"_"+i+"_"+Math.floor(Math.random()*999) };
        for(var f in fields) thread[f]=fields[f];
        acct.threads.push(thread); added++;
      }
      for(var k=0;k<5;k++){ var v=(msgs[k]||"").trim(); if(v) state.notes[acct.id+"|"+thread.id+"|"+k]=v; }
      lastAcctId=acct.id;
    }
    // drop any account left empty because all its rows hit the cap
    state.accounts=state.accounts.filter(function(a){ return (a.threads||[]).length>0; });
    if(lastAcctId && state.accounts.some(function(a){return a.id===lastAcctId;})) state.activeId=lastAcctId;
    return {ok:true, added:added, updated:updated, skipped:skipped};
  }

  // turn any Google Sheets link into an anonymously-fetchable CSV URL.
  // Use the gviz endpoint for /edit links — it works with "anyone with the
  // link" sharing, unlike /export which often 401s for anonymous requests.
  function sheetCsvUrl(u){
    u=(u||"").trim();
    if(/output=csv/i.test(u) || /tqx=out:csv/i.test(u)) return u;
    var mE=u.match(/\/spreadsheets\/d\/e\/([^/]+)\/pub/);
    if(mE){ var g=(u.match(/[?&]gid=(\d+)/)||[])[1]; return "https://docs.google.com/spreadsheets/d/e/"+mE[1]+"/pub?output=csv"+(g?("&gid="+g):""); }
    var mId=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if(mId){ var g2=(u.match(/[#&?]gid=(\d+)/)||[])[1]; return "https://docs.google.com/spreadsheets/d/"+mId[1]+"/gviz/tq?tqx=out:csv"+(g2?("&tq=&gid="+g2):""); }
    return u;
  }

  // Lazy-load the Excel reader only when someone actually uploads an .xlsx.
  var _xlsxP=null;
  function loadXLSX(){
    if(window.XLSX) return Promise.resolve(window.XLSX);
    if(_xlsxP) return _xlsxP;
    _xlsxP=new Promise(function(resolve,reject){
      var s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      s.onload=function(){ window.XLSX ? resolve(window.XLSX) : reject(new Error("Excel reader failed to load")); };
      s.onerror=function(){ reject(new Error("Couldn\u2019t load the Excel reader \u2014 check your connection")); };
      document.head.appendChild(s);
    });
    return _xlsxP;
  }
  function applyImportRows(rows){
    rows=(rows||[]).map(function(row){ return (row||[]).map(function(c){ return c==null?"":String(c); }); });
    if(rows.length<2){ toast("That file has no contact rows"); return; }
    var res=importRows(rows, true);
    if(!res.ok){ toast(res.msg); return; }
    state.seeded=true; persistAccounts(); render();
    toast("Imported: "+res.added+" added, "+res.updated+" updated");
    if(res.skipped) openUpgrade(res.skipped+" contact"+(res.skipped>1?"s":"")+" didn’t fit your "+FREE_CONTACT_CAP+" free slots.");
  }
  function handleImportFile(file){
    if(!file) return;
    var nm=(file.name||"").toLowerCase(), ty=(file.type||"").toLowerCase();
    var isXlsx=/\.(xlsx|xls)$/.test(nm) || ty.indexOf("sheet")>-1 || ty.indexOf("excel")>-1;
    if(isXlsx){
      toast("Reading Excel\u2026");
      loadXLSX().then(function(XLSX){
        var rd=new FileReader();
        rd.onload=function(){
          try{
            var wb=XLSX.read(new Uint8Array(rd.result), {type:"array"});
            var sh=wb.Sheets[wb.SheetNames[0]];
            applyImportRows(XLSX.utils.sheet_to_json(sh, {header:1, blankrows:false, defval:""}));
          }catch(e){ toast("Couldn\u2019t read that Excel file"); }
        };
        rd.onerror=function(){ toast("Couldn\u2019t read that file"); };
        rd.readAsArrayBuffer(file);
      }).catch(function(e){ toast(e.message||"Excel reader failed to load"); });
    } else {
      var rd=new FileReader();
      rd.onload=function(){ applyImportRows(parseCSV(String(rd.result||""))); };
      rd.onerror=function(){ toast("Couldn\u2019t read that file"); };
      rd.readAsText(file);
    }
  }
  function deleteAcct(id){

  // ---------- duplicate detection / cleanup ----------
  function normCompany(s){
    return (s||"").toLowerCase().trim()
      .replace(/[.,/&]/g," ")
      .replace(/\b(inc|llc|ltd|limited|corp|corporation|co|company|gmbh|sa|sas|srl|plc|the)\b/g," ")
      .replace(/\s+/g," ").trim();
  }
  function normContact(t){
    var e=(t.email||"").toLowerCase().trim();
    if(e) return "e:"+e;
    var li=(t.linkedin||"").toLowerCase().trim().replace(/\/+$/,"");
    if(li) return "l:"+li;
    var n=(t.name||"").toLowerCase().replace(/\s+/g," ").trim();
    return n ? "n:"+n : "";
  }
  function migrateKey(map, from, to){
    if(from===to) return;
    if(map[from]!=null){ if(map[to]==null) map[to]=map[from]; delete map[from]; }
  }
  function dedupeThreads(acct){
    var seen={}, kept=[], removed=0;
    (acct.threads||[]).forEach(function(t){
      var k=normContact(t);
      if(!k){ kept.push(t); return; }
      if(seen[k]){
        var keep=seen[k];
        ["title","email","linkedin","angle"].forEach(function(f){ if(!((keep[f]||"").trim()) && (t[f]||"").trim()) keep[f]=t[f]; });
        for(var c=0;c<5;c++){
          migrateKey(state.done, acct.id+"|"+t.id+"|"+c, acct.id+"|"+keep.id+"|"+c);
          migrateKey(state.notes, acct.id+"|"+t.id+"|"+c, acct.id+"|"+keep.id+"|"+c);
        }
        removed++;
      } else { seen[k]=t; kept.push(t); }
    });
    acct.threads=kept;
    return removed;
  }
  function countDuplicates(){
    var groups={}, dupAccts=0, dupThreads=0;
    state.accounts.forEach(function(a){ var k=normCompany(a.company)||("id:"+a.id); (groups[k]=groups[k]||[]).push(a); });
    Object.keys(groups).forEach(function(k){
      dupAccts += groups[k].length-1;
      var seen={};
      groups[k].forEach(function(a){ (a.threads||[]).forEach(function(t){ var ck=normContact(t); if(!ck) return; if(seen[ck]) dupThreads++; else seen[ck]=1; }); });
    });
    return { accounts:dupAccts, threads:dupThreads };
  }
  function runDedupe(){
    var groups={};
    state.accounts.forEach(function(a){ var k=normCompany(a.company)||("id:"+a.id); (groups[k]=groups[k]||[]).push(a); });
    var newAccounts=[], removedAccts=0, removedThreads=0;
    Object.keys(groups).forEach(function(k){
      var list=groups[k].slice().sort(function(a,b){ return (a.start||"").localeCompare(b.start||""); });
      var keep=list[0]; keep.threads=keep.threads||[];
      for(var i=1;i<list.length;i++){
        var b=list[i];
        (b.threads||[]).forEach(function(t){
          for(var c=0;c<5;c++){
            migrateKey(state.done, b.id+"|"+t.id+"|"+c, keep.id+"|"+t.id+"|"+c);
            migrateKey(state.notes, b.id+"|"+t.id+"|"+c, keep.id+"|"+t.id+"|"+c);
          }
          keep.threads.push(t);
        });
        removedAccts++;
      }
      removedThreads += dedupeThreads(keep);
      newAccounts.push(keep);
    });
    state.accounts=newAccounts;
    if(!state.accounts.some(function(a){return a.id===state.activeId;})) state.activeId=state.accounts.length?state.accounts[0].id:null;
    return { accounts:removedAccts, threads:removedThreads };
  }

  // ---- daily total / goal / streak (derived from state.done + state.extra) ----
  function goalVal(){ return state.dailyGoal || 10; }

  function streakWithBend(){
    var goal=goalVal(), streak=0, misses=0, off = dayTotal(todayStr())>=goal ? 0 : 1;

    return streak;
  }

  // ---- adapter: flatten accounts/threads into cadence contacts ----
  function asContacts(){
    var out=[];
    state.accounts.forEach(function(a){ (a.threads||[]).forEach(function(t){
      if(t.persona==="Blocker") return; // held, not in cadence
      var touches=buildTouches({id:a.id, start:a.start, threads:[t]});
      var step=0; while(step<touches.length && state.done[touches[step].id]) step++;
      out.push({ a:a, t:t, name:t.name, title:t.title, account:a.company, status:t.status||"active", step:step, touches:touches, complete:step>=touches.length });
    }); });
    return out;
  }
  function lastDoneDate(c){ var m=""; c.touches.forEach(function(x){ var d=state.done[x.id]; if(d && d>m) m=d; }); return m; }
  function dueInfo(c){
    if(c.complete || c.status!=="active") return null;
    var cur=c.touches[c.step], due;
    if(c.step===0) due=cur.date;                                   // first touch on schedule
    else { var gap=CADENCE[c.step].off - CADENCE[c.step-1].off; due=iso(addDays(lastDoneDate(c), gap)); } // reschedule from last completion
    var override=state.reschedule && state.reschedule[cur.id];
    if(override) due=override;
    return { ch:cur.ch, stepNum:c.step+1, touch:cur, overdueDays:daysBetween(due, todayStr()), dueKey:due };
  }

    return {txt:"next: "+CH_LABEL[i.ch]+" in "+(-i.overdueDays)+"d", gold:false};

  // ---- add contacts (quick bulk-add into existing account model) ----
  function addQuick(acctVal, bulkVal){
    var acct=(acctVal||"").trim(), bulk=(bulkVal||"").trim();
    if(!acct){ toast("Account name first"); return false; }
    if(!bulk){ toast("Add at least one person"); return false; }
    // gather valid people first so we can respect the free cap before mutating state
    var people=[];
    bulk.split("\n").forEach(function(line){
      line=line.trim(); if(!line) return;
      var p=line.split(","), name=(p[0]||"").trim(), title=p.slice(1).join(",").trim();
      if(name) people.push({name:name, title:title});
    });
    if(!people.length){ toast("No valid lines"); return false; }
    var left=freeLeft(), blocked=0;
    if(people.length>left){ blocked=people.length-Math.max(0,left); people=people.slice(0,Math.max(0,left)); }
    if(!people.length){ openUpgrade("You’ve reached your "+FREE_CONTACT_CAP+" free contacts."); return false; }
    var a=state.accounts.find(function(x){ return normCompany(x.company)===normCompany(acct); });
    if(!a){ a={ id:"a"+Date.now(), company:acct, start:todayStr(), threads:[] }; state.accounts.push(a); }
    a.threads=a.threads||[];
    var entry=Math.max(1, daysBetween(a.start, todayStr())+1); // day 1 = today
    var added=0;
    people.forEach(function(pp){
      a.threads.push({ id:"t"+Date.now()+"_"+added+"_"+Math.floor(Math.random()*999), name:pp.name, title:pp.title, persona:"Additional", entryDay:entry, channel:"li", linkedin:"", email:"", angle:"", status:"active" });
      added++;
    });
    persistAccounts(); render();
    if(blocked>0){ openUpgrade("Added "+added+". "+blocked+" more would pass your "+FREE_CONTACT_CAP+" free contacts."); }
    else toast(added+" added to cadence");
    return true;
  }

  function doRestore(file){

      var data; try{ data=JSON.parse(reader.result); }catch(e){ toast("Not a valid backup"); return; }
      if(!data || !Array.isArray(data.accounts)){ toast("Not an VAMOS backup"); return; }
      if(!confirm("Restore this backup? Replaces current accounts, touches and messages.")) return;
      state.accounts=data.accounts||[]; state.done=data.done||{}; state.notes=data.notes||{}; state.reschedule=data.reschedule||{}; state.todos=Array.isArray(data.todos)?data.todos:(state.todos||[]); state.extra=data.extra||{}; state.coldStreakSince=data.coldStreakSince||null; state.seeded=true;

  // Pulls whatever this browser saved to localStorage before/outside login
  // (a separate key namespace apiSave() never touches) and merges it into
  // the signed-in account's cloud data, skipping accounts already present by id.
  async function doUploadLocal(){
    var raw=await sGet("tracker:accounts");
    var localAccounts=[]; try{ localAccounts=JSON.parse(raw)||[]; }catch(e){}
    if(!localAccounts.length){ toast("No local data found on this device"); return; }

    var localDone={}, localNotes={}, localReschedule={}, localExtra={};
    try{ localDone=JSON.parse(await sGet("tracker:done"))||{}; }catch(e){}
    try{ localNotes=JSON.parse(await sGet("tracker:notes"))||{}; }catch(e){}
    try{ localReschedule=JSON.parse(await sGet("tracker:reschedule"))||{}; }catch(e){}
    try{ localExtra=JSON.parse(await sGet("tracker:extra"))||{}; }catch(e){}
    var localSheetUrl=(await sGet("tracker:sheetUrl"))||"";
    var localHandoff=(await sGet("tracker:handoffNote"))||"";

    if(!confirm("Found "+localAccounts.length+" account(s) saved on this device. Add them to your VAMOS account? Existing cloud data is kept — matching accounts are skipped.")) return;

    var existingIds={}; state.accounts.forEach(function(x){ existingIds[x.id]=true; });
    var added=0;
    localAccounts.forEach(function(acc){
      if(existingIds[acc.id]) return;
      state.accounts.push(acc); added++;
    });
    Object.keys(localDone).forEach(function(k){ if(!(k in state.done)) state.done[k]=localDone[k]; });
    Object.keys(localNotes).forEach(function(k){ if(!(k in state.notes)) state.notes[k]=localNotes[k]; });
    Object.keys(localReschedule).forEach(function(k){ if(!(k in state.reschedule)) state.reschedule[k]=localReschedule[k]; });
    Object.keys(localExtra).forEach(function(k){ if(!(k in state.extra)) state.extra[k]=localExtra[k]; });
    if(!state.sheetUrl && localSheetUrl) state.sheetUrl=localSheetUrl;
    if(!state.handoffNote && localHandoff) state.handoffNote=localHandoff;
    if(!state.activeId && state.accounts.length) state.activeId=state.accounts[0].id;
    state.seeded=true;

    persistAccounts(); render();
    toast(added ? ("Uploaded "+added+" account(s) from this device") : "Already up to date — nothing new to add");
  }

  function ltMonday(d){ var day=d.getDay(); var diff=(day===0?-6:1-day); var m=new Date(d); m.setDate(d.getDate()+diff); return m; }
  // honest "last pulled" label — real record timestamp, never a fabricated freshness claim
  function ltTimeAgo(ms){
    if(!ms) return "—";
    var diff=Date.now()-ms; if(diff<0) diff=0;
    var min=Math.round(diff/60000);
    if(min<1) return "JUST NOW";
    if(min<60) return min+" MIN AGO";
    var hr=Math.round(min/60);
    if(hr<24) return hr+(hr===1?" HR AGO":" HRS AGO");
    var day=Math.round(hr/24);
    return day+(day===1?" DAY AGO":" DAYS AGO");
  }
  // ---- HOME: animated intro splash (glyph field + entry card) ----
  var ltIntroStop=null;
  function ltStopIntroField(){ if(ltIntroStop){ ltIntroStop(); ltIntroStop=null; } }
  function ltStartIntroField(canvas){
    var ctx=canvas.getContext("2d");
    var dpr=window.devicePixelRatio||1;
    var w=0, h=0, particles=[];
    function hexToRgba(hex, a){
      hex=(hex||"#0a0a0a").trim().replace("#","");
      if(hex.length===3) hex=hex.split("").map(function(c){return c+c;}).join("");
      var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
      if(isNaN(r)||isNaN(g)||isNaN(b)){ r=10; g=10; b=10; }
      return "rgba("+r+","+g+","+b+","+a+")";
    }
    var inkHex=getComputedStyle(document.documentElement).getPropertyValue("--lt-ink").trim();
    function resize(){
      w=canvas.clientWidth; h=canvas.clientHeight;
      canvas.width=Math.max(1,Math.round(w*dpr)); canvas.height=Math.max(1,Math.round(h*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();
    var n=Math.min(70, Math.max(24, Math.round((w*h)/16000)));
    for(var i=0;i<n;i++){
      particles.push({x:Math.random()*w, y:Math.random()*h, r:1+Math.random()*1.6, vx:(Math.random()-.5)*.12, vy:(Math.random()-.5)*.12, a:.12+Math.random()*.28});
    }
    var running=true, raf=null;
    function tick(){
      if(!running) return;
      ctx.clearRect(0,0,w,h);
      particles.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<-4) p.x=w+4; if(p.x>w+4) p.x=-4;
        if(p.y<-4) p.y=h+4; if(p.y>h+4) p.y=-4;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=hexToRgba(inkHex,p.a); ctx.fill();
      });
      raf=requestAnimationFrame(tick);
    }
    tick();
    var onResize=function(){ resize(); };
    window.addEventListener("resize", onResize);
    return function stop(){ running=false; if(raf) cancelAnimationFrame(raf); window.removeEventListener("resize", onResize); };
  }

      viewport.addEventListener("keydown", function(e){

      });
      (function(){
        var dragging=false, startX=0, startTx=0, moved=0, pointerId=null;
        viewport.addEventListener("pointerdown", function(e){
          dragging=true; moved=0; startX=e.clientX; startTx=-ltCarIdx*CARD_W; pointerId=e.pointerId;
        });
        viewport.addEventListener("pointermove", function(e){
          if(!dragging) return;
          var dx=e.clientX-startX; moved=Math.abs(dx);
          // only claim the pointer (and visually commit to a drag) past a small
          // threshold — capturing immediately on pointerdown retargets the
          // click event away from buttons inside the card, breaking taps

        }
        viewport.addEventListener("pointerup", endDrag);
        viewport.addEventListener("pointercancel", endDrag);
        viewport.addEventListener("click", function(e){ if(moved>6){ e.stopPropagation(); moved=0; } }, true);
      })();

  // Loads a contact into Today if they're actually due; otherwise sends the
  // rep to Pipeline, since Today's queue only ever holds due/overdue people.
  var CONTACT_FILTERS=[["all","ALL"],["cadence","IN CADENCE"],["cold","GOING COLD"],["contractors","CONTRACTORS"],["never","NEVER CONTACTED"]];
  var ltContactFilter="all", ltContactsOpenIdx=null, ltContactsQuery="";
  function ltIsCold(c){ var lt=lastDoneDate(c); return c.status==="active" && !c.complete && !!lt && daysBetween(lt,todayStr())>=7; }
  function ltFilterMatch(c, key){
    if(key==="cadence") return c.status==="active" && !c.complete;
    if(key==="cold") return ltIsCold(c);
    if(key==="contractors") return !!(c.t && c.t.isContractor);
    if(key==="never") return c.step===0;
    return true;
  }
  function ltFilterCount(contacts, key){ return contacts.filter(function(c){ return ltFilterMatch(c,key); }).length; }
  function ltMomentumPct(c){
    if(c.status==="meeting") return 100;
    if(c.status==="warm") return 80;
    if(c.complete) return 8;
    var lastTouch=lastDoneDate(c);
    if(!lastTouch) return Math.max(15, c.step*15);
    var days=daysBetween(lastTouch, todayStr());
    return Math.max(6, 100-days*6);
  }
  function ltStage(c){
    if(c.status==="meeting") return "IN CONVO";
    if(c.status==="warm") return "REPLIED";
    if(c.step===0) return "NEW";
    return "OPENED";
  }
  function ltLastTouchLabel(c){
    var lastTouch=lastDoneDate(c);
    if(!lastTouch) return "—";
    var days=daysBetween(lastTouch, todayStr());
    if(days<=0) return "TODAY";
    if(days===1) return "1 DAY";
    return days+" DAYS";
  }
  function ltPipelineStage(c){
    if(c.status==="meeting") return "IN CONVO";
    if(c.status==="warm") return "REPLIED";
    return "OPENED"; // folds in NEW (step 0) — Pipeline has no separate NEW column
  }
  function ltStageReason(c){
    if(c.status==="meeting") return "MEETING BOOKED";
    if(c.status==="warm") return "REPLIED — YOUR MOVE";
    var lastTouch=lastDoneDate(c);
    if(!lastTouch) return "NEVER CONTACTED";
    var days=daysBetween(lastTouch, todayStr());
    return days+" DAY"+(days===1?"":"S")+" QUIET";
  }
  function ltTouchesSent30d(){
    var since=iso(addDays(todayStr(), -30)), n=0;
    for(var k in state.done){ if(state.done[k]>=since) n++; }
    return n;
  }
  function ltFalloffCounts(contacts){
    var counts=[0,0,0,0,0];
    contacts.forEach(function(c){ c.touches.forEach(function(t,idx){ if(idx<5 && state.done[t.id]) counts[idx]++; }); });
    return counts;
  }
  // Real health metric, not a fabricated streak: tracks the actual date the
  // going-cold count last hit zero, persisted, so "days running" is honest.
  function ltUpdateColdStreak(contacts){
    var cold=contacts.filter(ltIsCold).length;
    if(cold>0){ if(state.coldStreakSince){ state.coldStreakSince=null; scheduleSave(); } }
    else if(!state.coldStreakSince){ state.coldStreakSince=todayStr(); scheduleSave(); }
  }
  function ltColdStreakDays(){
    if(!state.coldStreakSince) return 0;
    return daysBetween(state.coldStreakSince, todayStr())+1;
  }

      } else {

  // ---------- ADHD moment: pomodoro · just-do-one · breathe ----------
  var POMO=null;
  function fmtClock(s){ var m=Math.floor(s/60), ss=s%60; return m+":"+(ss<10?"0":"")+ss; }
  function pomoRender(){
    var w=document.getElementById("pomo"); if(!w||!POMO) return;
    w.querySelector(".pomo-time").textContent=fmtClock(POMO.remaining);
    w.querySelector(".pomo-mode").textContent=POMO.mode==="work"?"Focus block":"Break";
    w.classList.toggle("brk", POMO.mode==="break");
    w.querySelector(".pomo-toggle").textContent=POMO.running?"Pause":"Start";
  }
  function pomoTick(){
    if(!POMO||!POMO.running) return;
    POMO.remaining--;
    if(POMO.remaining<=0){
      var wasWork=POMO.mode==="work";
      POMO.mode=wasWork?"break":"work";
      POMO.remaining=wasWork?5*60:25*60;
      POMO.running=false; // wait for them to choose to start the next block
      toast(wasWork?"Time. Take 5 — step away.":"Break’s over. One block, that’s it.");
    }
    pomoRender();
  }
  function closePomodoro(){ if(POMO&&POMO.id) clearInterval(POMO.id); POMO=null; var w=document.getElementById("pomo"); if(w) w.remove(); }
  function openPomodoro(){
    if(document.getElementById("pomo")){ return; }
    POMO={remaining:25*60, running:true, mode:"work", id:setInterval(pomoTick,1000)};
    var w=el('<div class="pomo" id="pomo"><div class="pomo-mode">Focus block</div><div class="pomo-time">25:00</div><div class="pomo-row"><button class="pomo-toggle">Pause</button><button class="pomo-reset">Reset</button><button class="pomo-close">✕</button></div></div>');
    w.querySelector(".pomo-toggle").addEventListener("click", function(){ POMO.running=!POMO.running; pomoRender(); });
    w.querySelector(".pomo-reset").addEventListener("click", function(){ POMO.mode="work"; POMO.remaining=25*60; POMO.running=true; pomoRender(); });
    w.querySelector(".pomo-close").addEventListener("click", closePomodoro);
    document.body.appendChild(w);
    pomoRender();
  }

      '<div class="fld"><label>New email</label><input class="auth-input" id="ceNew" type="email" placeholder="you@company.com"></div>'+
      '<div class="fld"><label>Password</label><input class="auth-input" id="cePw" type="password" placeholder="Confirm it’s you"></div>'+
      '<div class="sc-err" id="ceErr"></div>'+
      '<button class="btn" id="ceSave">Send confirmation</button>'+
    '</div></div>');
    ov.querySelector("#ceClose").addEventListener("click", function(){ ov.remove(); });
    ov.querySelector("#ceSave").addEventListener("click", async function(){
      var err=ov.querySelector("#ceErr"); err.textContent="";
      var email=(ov.querySelector("#ceNew").value||"").trim(), pw=ov.querySelector("#cePw").value||"";
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent="Enter a valid email address."; return; }
      if(!pw){ err.textContent="Enter your password."; return; }
      var btn=ov.querySelector("#ceSave"), bl=btn.textContent; btn.disabled=true; btn.textContent="Sending…";
      try{
        var r=await fetch("/api/auth?action=change-email",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:email,password:pw})});
        var d=await r.json().catch(function(){ return {}; });
        if(!r.ok||!d.ok) throw new Error(d.error||"Couldn’t update — try again.");
        if(ACCOUNT){ ACCOUNT.email=d.email||email; if(d.verified!=null) ACCOUNT.verified=d.verified; }
        ov.remove(); render(); toast("Almost there — confirm from your new inbox.");
      }catch(e){ err.textContent=(e&&e.message)||"Couldn’t update — try again."; btn.disabled=false; btn.textContent=bl; }
    });
    document.body.appendChild(ov);
    ov.querySelector("#ceNew").focus();
  }
  // Delete account — double confirm (type DELETE + password), then purge.
  function openDeleteAccount(){
    var ov=el('<div class="sender-overlay"><div class="sender-card">'+
      '<button class="sc-close" id="daClose" aria-label="Close">&times;</button>'+
      '<h2>Delete account</h2>'+
      '<p class="sc-help">This permanently deletes your account, contacts, drafts, and history. It cannot be undone.</p>'+
      '<div class="fld"><label>Type DELETE to confirm</label><input class="auth-input" id="daType" placeholder="DELETE" autocomplete="off"></div>'+
      '<div class="fld"><label>Password</label><input class="auth-input" id="daPw" type="password"></div>'+
      '<div class="sc-err" id="daErr"></div>'+
      '<button class="btn" id="daGo" style="background:#A5341F;border-color:#A5341F">Delete my account</button>'+
    '</div></div>');
    ov.querySelector("#daClose").addEventListener("click", function(){ ov.remove(); });
    ov.querySelector("#daGo").addEventListener("click", async function(){
      var err=ov.querySelector("#daErr"); err.textContent="";
      var typed=(ov.querySelector("#daType").value||"").trim(), pw=ov.querySelector("#daPw").value||"";
      if(typed!=="DELETE"){ err.textContent="Type DELETE to confirm."; return; }
      if(!pw){ err.textContent="Enter your password."; return; }
      var btn=ov.querySelector("#daGo"), bl=btn.textContent; btn.disabled=true; btn.textContent="Deleting…";
      try{
        var r=await fetch("/api/auth?action=delete-account",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:pw})});
        var d=await r.json().catch(function(){ return {}; });
        if(!r.ok||!d.ok) throw new Error(d.error||"Couldn’t delete — try again.");
        ov.remove(); ACCOUNT=null; clearState(); comebackDismissed=false; navView="landing"; closeComeback(); showApp(false); toast("Your account was deleted.");
      }catch(e){ err.textContent=(e&&e.message)||"Couldn’t delete — try again."; btn.disabled=false; btn.textContent=bl; }
    });
    document.body.appendChild(ov);
    ov.querySelector("#daType").focus();
  }

  wireLanding();
  boot();

})();
</script>
